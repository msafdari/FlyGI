  H-JEPA-SPONTANEOUS:
    statement: >
      The frozen connectome's neural state N_t, driven by real ARC observation
      streams through the bio-eye encoder, spontaneously carries JEPA-like
      predictive structure: a linear probe from N_t predicts the NEXT
      observation's column representation better than (B1) the current
      observation alone, (B2) a delay-embedded observation history of matched
      dimension, (B3) the same probe on a degree-preserving null graph's state,
      and (B4) a no-recurrence leaky-integrator bypass. B1 tests memory at all;
      B2 tests nontrivial latent structure beyond raw history; B3/B4 test
      whether the fly's WIRING (not generic recurrence) supplies it. Claim
      tiers preregistered: beating only B1 = generic reservoir memory (weak);
      beating B2 = latent predictive structure (medium); beating B3/B4 =
      anatomy-specific predictive structure (the strong claim). Probes are
      ridge regressions only -- nothing is trained in the network, so JEPA
      collapse does not arise; this asks whether biology already did JEPA's
      job.
