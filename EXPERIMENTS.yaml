  H-DEAD-GAMES-TAXONOMY:
    statement: >
      The 14 never-scoring games fail for heterogeneous reasons requiring
      per-game mechanisms.
    status: refuted
    evidence:
      - >
        FORENSICS MEASURED 2026-09-25 (stage-1 uniform trace metrics + a
        3-agent grid-rendering deep read, wf_71d9021e-8ae; every claim
        grounded in rendered frames and trace diffs). The games are NOT
        heterogeneous -- all 14 share one architecture: (1) an explicit
        per-action TIMER/budget strip giving hard 35-130-action lives,
        with every GAME_OVER restoring the initial frame at measured 100%
        cell identity -- progress is erased, deaths are clocks, not
        hazards; (2) level 1 is a SHORT EXACT PROGRAM (5-35 correct
        actions; human baselines 18-71) whose goal specification is
        DISPLAYED ON SCREEN -- a uniquely-coloured marker tile (ls20
        tu93), same-colour dots for crosshairs (re86), a glyph legend
        (tr87 sb26), the board's own miniature (ft09), a die-face
        template (sc25), pads to mate (cn04), a slot to push a box into
        (ka59), a delivery order (sk48), a dashed path (su15), recipe
        cards (dc22), a corridor to climb (bp35); (3) churn is actively
        poisoned: the timer pixels make EVERY action an observation
        change, so the stage-1 86-100% change rates are partly the games
        counting down -- the consequence head's teaching signal is
        contaminated by the clock -- and toggles/undo/deselect unwrite
        partial progress while resets wipe the rest. UNIFYING MISSING
        CAPABILITY, one class, two flavours: VISUALLY-GUIDED TAXIS --
        (a) spatial: reduce the distance between the controlled object
        (identifiable as the efference-correlated moving sprite) and the
        unique salient target (identifiable by the retinotopic saliency
        machinery measured at 0.8-3.5-cell localization); (b) template:
        make region A match displayed template B by exact clicks. Both
        are fly-shaped at the component level (object fixation/taxis is
        the fly's most basic visual behaviour; LC neurons encode object
        position for orientation) and both seat in the PRIMARY term for
        directional actions exactly as the click head does for clicks.
        Registered premise-killers before any build: from captured
        streams, (i) can the avatar be segmented as the action-correlated
        moving component, (ii) can the goal be segmented as the unique
        salient static object, (iii) in how many of the 14 games do (i)
        and (ii) both succeed. Also MEASURED for the current candidate:
        the timer contamination means the deployed consequence head
        learns "everything works" in dead games -- a timer-mask (ignore
        constant-location single-cell changes) is a registered head
        improvement independent of taxis. TIMER-MASK ARM MEASURED
        2026-09-25 ~14:50 PDT (sg-combo-tm vs sg-combo): MIXED -- score
        0.3648 vs 0.3519 (inside seed noise), levels 23 vs 24. The
        pre-stated both-clause rule holds: the shipped combo is
        unchanged; the knob stays available, default-off.
      - >
        PREMISE-KILLERS RUN 2026-09-25, PREMISE SURVIVES (results/
        taxis_premise_v2.json; corrected shift-matching detector after a
        v1 whose failures were the detector's own): (i) AVATAR
        segmentation by action-correlated translation PASSES in 11/14
        games, recovering the forensics' measured motions exactly (ls20
        +/-5px on actions 3/4; cn04 and re86 +/-3px on all four) -- the
        fails are correct: ft09/sb26 are template-flavour with no avatar,
        su15's avatar moves on clicks not arrows; (ii) GOAL segmentation
        as unique-salient-static-object PASSES 10/14 with ALL FOUR
        forensics-named targets HIT (ls20 glyph, tu93 e-tile, re86 dot,
        su15 blob); (iii) BOTH pass in 10/14 overall, 7/9 on the
        spatial-flavour games. The spatial-taxis build (greedy
        distance-reduction between the efference-correlated sprite and
        the segmented target, seated in the PRIMARY term for directional
        actions with the same evidence decay as the click head) is
        premise-backed on ~10 currently-dead games whose human baselines
        are 18-71 actions. Trivial alternatives named for the build:
        random-target attraction (same machinery, random stable component
        as goal) and the no-taxis champion.
      - >
        TAXIS ARM MEASURED 2026-09-25 13:42 PDT (sg-taxis, 75 rows,
        combo+taxis vs combo): NULL. Zero of the fourteen dead games
        converted; the host combo was mildly harmed (22 levels / 0.2697
        vs 24 / 0.3519; g50t traded for ar25 -- perturbation churn). The
        MECHANISM is not in question -- gates measured exact per-game
        movers learned live, the forensics-named target correctly
        selected, the avatar pulled from distance 18 to 2, wall memory
        working -- so the recorded conclusion is about the GAMES:
        reaching/touching the displayed salient object is not the level-1
        trigger; the short exact programs require interactions beyond
        arrival (sequenced toggles in re86, whatever ls20's glyph
        actually wants, sub-timer-life execution in tu93). Iterations
        spent per discipline: shift-scorer fix, rank promotion, wall
        memory, endgame tolerance -- four measured fixes, then the arm
        decided. Random-target control cancelled as moot (no positive
        effect to attribute). The taxis knob stays default-off; the
        shipped combo candidate is untouched. Level-2 wall standing:
        composition above arrival semantics remains the frontier.
    updated: 2026-09-25
  H-T4T5-CLASS25-MOTION:
    statement: >
      The class-2.5-validated T4/T5 population (trained flyvis ensemble
      parameters on the MaleCNS patch, DSI band passed) computes motion
      direction on real ARC frame pairs well enough that its population
      response decodes sprite displacement direction on HELD-OUT games,
      beating the uniform-tau control, the degree-preserving null, and
      the engineered block-matching equivalent -- the motion detector's
      native function doing real work on this task's actual dynamics.
    status: refuted
    evidence:
      - >
        PREREGISTERED 2026-09-30 BEFORE IMPLEMENTATION. Protocol:
        ground-truth sprite displacements come from the taxis premise
        machinery's measured exact movers (results/taxis_premise_v2
        protocol; the 11 games where action-correlated translation was
        recovered exactly); stimuli are real consecutive frame pairs
        around a measured displacement, presented retinotopically to
        the class-2.5 patch at its PASSING configuration (verbatim
        from fc25_visual_ds.json, no re-tuning); features = T4a-d/
        T5a-d population responses in the crossing-window readout;
        decoder = one linear probe per arm, trained on displacement
        events from TRAIN games, scored 4-way direction accuracy on
        HELD-OUT games x 3 seeds. CONTROLS, all mandatory, same probe:
        uniform-tau-with-trained-strengths features (the class-2.5
        attribution twin); degree-preserving rewired patch; engineered
        equivalent = the taxis shift-matcher's own direction estimate
        (the repo's existing trivial alternative, which is ~exact on
        these games -- stated openly: beating it is NOT required for
        validation of the fly claim, matching the preregistered bands
        below is). PASS BANDS, fixed now: held-out 4-way accuracy >
        0.25 chance (binomial p < 0.05) AND real > uniform-tau twin
        AND real > degree-preserving null (paired sign tests p < 0.05
        across game x seed cells). The engineered matcher's accuracy
        is reported alongside as the ceiling context. Expected tier,
        base rate stated: ~2 for 15 now.
      - >
        MEASURED 2026-09-30 (scripts/benchmarks/t4t5_motion_arm.py,
        results/benchmarks/t4t5_motion_arm.json; 660 verified
        displacement events across 11 qualifying games, 4 held-out
        games x 3 seeds, protocol executed in full): FAIL against
        bands 2-3, the second attributed fly-negative, with the same
        decomposition as the MB arm. Real 0.3875 held-out 4-way
        accuracy -- above chance in every seed (band 1 holds), so the
        validated patch DOES carry direction signal on real frames.
        But the uniform-tau twin matches it (0.3917, p=0.94) and the
        degree-preserving rewire EXCEEDS it (0.4306, p=0.97): neither
        the temporal heterogeneity nor the specific wiring is
        load-bearing for the signal a linear probe can use on ARC's
        displacement statistics. The engineered block-matcher is a
        perfect 1.0000 ceiling, as stated at registration. VERDICT:
        T4/T5 is NOT USEFUL for ARC motion decoding at validated
        class-2.5 fidelity -- the native function runs, the task
        does not need what the wiring specifically adds.
    updated: 2026-09-30

  H-ONLINE-SEARCH:
    statement: >
      A budgeted online breadth-first program search -- simple actions
      plus scene-component-derived clicks, frame-dedup, RESET replay,
      the live game as its own oracle -- is a GAME-AGNOSTIC mechanism
      that converts unseen games whose level-1 state space is small,
      and is therefore the one remaining architecture idea with
      hidden-set upside after three submissions measured that
      game-specific grammars transfer zero (LB 0.15 = the generic
      floor, three times).
    status: supported
    evidence:
      - >
        PREREGISTERED 2026-09-29/30 BEFORE THE SWEEP. Premise-killer:
        run the bounded search offline against all 25 public games
        (budget fixed at 4,000 expanded nodes and depth 16 per game;
        click branching from the champion's own scene-component
        candidates, capped per scene; sc25-style wake handling
        auto-detected). PREREGISTERED ENDPOINT: the number of games
        where the search finds a level-1-completing program within
        budget. DECISION BAR, fixed now: >= 5 of 25 games (i.e.,
        meaningfully beyond ft09/sc25, whose solvability blind search
        already partially probed) => build the online layer and take
        it through the battery + gateway gates; < 5 => the idea is
        dead and the score track has no remaining non-LLM lever in
        this repository's measured record. Secondary endpoints,
        reported alongside: distinct-state counts and depth-to-first-
        score distributions (the hidden-set feasibility proxy).
        Expected tier, base rate stated: ~1 for 14.
      - >
        MEASURED 2026-09-30 (scripts/online_search_premise.py,
        results/online_search_premise.json; budget applied exactly,
        zero errors, ~38 min): ELEVEN of 25 games fall to bounded
        blind search -- the bar (>=5) is met decisively. Program
        lengths 3-15. Instrument findings: the auto wake probe
        rediscovered sc25's post-reset swallow unprompted and found
        the SAME quirk in g50t (new); the auto timer rule
        rediscovered sc25's strip; ft09's null under the click cap is
        a candidate-RANKING null (the winning clicks sit at ranks
        24-31 of the champion ordering, cap 12); lf52/su15/tn36
        collapse to 1-2 states under the declared mask (flagged for a
        manual glance); seven games exhaust the node budget at
        6.3k-8.8k states (the unfavorable side of the proxy).
        PREREGISTERED CONSEQUENCE NOW DUE: build the online layer and
        take it through the battery + gateway gates.
      - >
        BUILD SHIP BARS, PREREGISTERED 2026-09-30 BEFORE THE LAYER
        EXISTS. Seating: a budgeted incremental BFS layer consulted by
        the policy (like the FAP seat: abstains by default), engaging
        only after a preregistered stuck signal (no level advance for
        75 reconciled turns), spending a bounded exploration budget
        (<= 1,500 emitted actions per level including RESET replays,
        then permanent abstention for that level), banking and
        executing any found program, and re-engaging per level. Wake
        and timer handling reuse the measured auto-detection. GATES,
        all required before any submission claim: (a) 75-row battery
        vs sg-combo-fap11 -- zero score losses on the 20 currently
        scoring games and at least THREE new game conversions among
