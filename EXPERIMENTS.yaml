# The experiment league: every condition, every hypothesis, one file.
#
# This is the project's central claim-tracker. `scripts/league.py` joins it
# against the immutable result bundles, the live checkpoints and the telemetry
# to render the leaderboard; nothing here duplicates a number that an artifact
# already holds. What this file owns is the part no artifact can derive:
# WHY each experiment exists, WHAT it is fairly compared against, and WHICH
# hypothesis its result moves.
#
# Rules, enforced by scripts/league.py where it can:
# - Every experiment names the condition string inside its result bundle.
# - Comparisons are valid only within the same regime. gain0.9 results were
#   measured on a network whose readout sat one significant digit above float32
#   epsilon (WORKLOG section 8); they are a record of that dead regime, not
#   baselines for anything since.
# - Hypothesis statuses move on evidence, with the experiment named. `open`
#   means untested, `null` means tested and no effect found, `invalidated`
#   means the test itself was later shown unsound -- which is not the same as
#   the hypothesis being false, and the note must say why.

schema_version: 1

regimes:
  gain0.9-dead:
    note: >
      Deployed operating point until 2026-09-23. Post-sensory activity ~2.6e-6,
      ~22x float32 epsilon; the whole regime is a measurement of numerical
      noise. Kept as history.
  gain2.0-modulators:
    note: >
      Operating point from WORKLOG section 9: -modulators graph (dopaminergic
      pathway present), recurrent_gain 2.0, readout ~5000x above epsilon. KC
      sparsity 0.123 vs biological 0.05-0.11, a declared compromise (H-APL).
  controller-only:
    note: Uses no connectome, so it is valid as a reference in every regime.

# Named game subsets for preregistered endpoints. The analyzer reads these;
# nothing else may duplicate them. Membership was measured on sg-g2-nolearn
# action counts and declared before any decoder arm ran a row.
endpoints:
  click_games_19:
    note: every game in which ACTION6 occurs
    games: [ar25, bp35, cd82, cn04, dc22, ft09, ka59, lf52, lp85, m0r0, r11l,
            s5i5, sb26, sc25, sk48, sp80, su15, tn36, vc33]
  click_dominant_9:
    note: games where ACTION6 is >60% of actions
    games: [bp35, dc22, ft09, lp85, r11l, s5i5, su15, tn36, vc33]
  full_25:
    note: the complete public set
    games: [ar25, bp35, cd82, cn04, dc22, ft09, g50t, ka59, lf52, lp85, ls20,
            m0r0, r11l, re86, s5i5, sb26, sc25, sk48, sp80, su15, tn36, tr87,
            tu93, vc33, wa30]

hypotheses:
  H-VISUAL-MEMORY-ENTRY:
    statement: >
      On the frozen 32-scene rectangle panel, positive KCg-d activity in the
      full MaleCNS rate model distinguishes orientation across positions with
      accuracy at least 0.75, exceeds both sensory-drive and type-mean floors
      by at least 0.10, exceeds chance at 12 of 16 target positions, and clears
      the specified numerical floor. This is a descriptive representation
      gate, not a learning, topology-superiority, or ARC-score claim.
    status: refuted
    protocol: docs/experiments/visual_memory_entry.md
    evidence:
      - "Pre-outcome design: no neural responses inspected; static input coverage checked."
      - >
        Measured 2026-09-26 at source b718f03: contract-valid frozen v1 run,
        32 scenes, full 166700-node signed-modulator graph, 32 steps per scene,
        all 206 KCg-d cells. Native transfer accuracy 0.521875, sensory drive
        0.55, type-mean 0.4979166667, graph-off 0.5. Native exceeds chance at
        9/16 positions (required 12); absolute accuracy and both margin clauses
        fail. Positive signal and same-position shape differences clear 1e-7.
        Result SHA256 1241b74f3e1df5a8621cf0667d0318c5ae19ba125da226ef3fccf8a9c337ed83
        at results/connectome_agent/visual_memory_entry_v1.json. This closes
        this interface/model/readout branch before plasticity; it does not test
        a living fly, arbitrary visual memory, or ARC performance. No tuning,
        anatomy-null expansion, plasticity build, or ARC promotion follows.
    updated: 2026-09-26
  H-ANATOMY-TIEBREAK:
    statement: >
      The connectome breaking the controller's ties beats the controller's own
      deterministic hash.
    status: "null"
    evidence:
      - "sg-fly-real vs sg-controller-only: levels exactly tied 20-20, score +0.0216, p=0.835"
    updated: 2026-09-23
  H-STATE-DEPENDENCE:
    statement: >
      Any observation-dependent tiebreaker helps; the fly would be incidental.
      (The deflationary reading of the fly's early partial lead.)
    status: refuted
    evidence:
      - "sg-fly-gridhash: 9 levels vs controller's 20; noise in the same seam actively hurts"
    updated: 2026-09-23
  H-BUDGET:
    statement: Score is limited by the 600-action budget.
    status: refuted
    evidence:
      - "sg-fly-real-1800: zero level completions after action 600 across 21 matched rows"
    updated: 2026-09-23
  H-MB-LEARNING:
    statement: >
      Controller-supplied reinforcement through KC->MBON depression improves
      score.
    status: "null"
    evidence:
      - "sg-g2-learn vs sg-g2-nolearn: flat (0.203451 vs 0.203443, fewer levels)"
      - >
        First test unsound: Kenyon cells received 0.00% sensory input.
      - >
        FAIR retest 2026-09-24 (sg-mbdr-learn vs sg-mbdr-nolearn, 75 matched
        rows, every precondition verified present -- PN bus with 23-78% scene
        separation, biological KC sparsity, rectified eligibility, efference
        copy with 144% action separation): -0.0004, CI [-0.001,+0.000],
        p=1.000; levels 15 v 16, breadth 6 v 7. Null, cleanly. With a ~31:1
        punishment-dominated signal over 600-action episodes, KC->MBON
        depression moves real weight and changes essentially nothing the
        controller acts on. Controls stay unlaunched per the preregistered
        gate. Note also: the mbdr circuit itself (nolearn) costs breadth
        locally vs plain g2-nolearn (7/25 vs 10/25) -- the bus/APL/efference
        package is behaviourally negative-to-null on this scaffold.
    updated: 2026-09-24
  H-OPERATING-POINT:
    statement: >
      Waking the network from the numerical floor (gain 0.9 -> 2.0 on the
      -modulators graph) improves score by itself.
    status: "null"
    evidence:
      - "sg-g2-nolearn vs sg-controller-only: +0.0088, p=0.8625"
      - "The defect was real (22x -> ~5000x epsilon) and fixing it was necessary; it was not sufficient."
    updated: 2026-09-23
  H-RETINOTOPY-COLOUR:
    statement: >
      An input that preserves both retinotopy and categorical colour lets the
      fly's visual hierarchy (T4/T5, LC) do work that the scrambled projection
      made impossible.
    status: "null"
    evidence:
      - "Encoder verified: adjacency preserved, colours categorical, T4/T5 pattern change 3.41x for motion"
      - >
        sg-bioeye-lc vs sg-lc, 75 matched rows: +0.009151, CI [-0.125, +0.172],
        p=0.817, levels exactly tied 16-16. The partial had drifted to +0.072 at
        59 rows and collapsed in the final 16 -- the third occurrence of this
        seed-ordered mirage. t4t5 arm pending; status set on the LC result.
    updated: 2026-09-23
  H-COLOUR-MAP:
    statement: >
      The colour->type rule (c % 15) is harmless convention; only the
      categorical-plus-retinotopic structure matters, not which medulla type
      carries which colour. (Assumption A of the encoder.)
    status: supported
    evidence:
      - >
        sg-bioeye-lc-permuted vs sg-bioeye-lc, complete: +0.022, CI
        [-0.108,+0.198], p=0.974 -- null, as preregistered. The colour->type
        assignment is harmless convention.
    updated: 2026-09-23
  H-PERCEPTION-READOUT:
    statement: >
      Reading high-signal perception populations (LC 16.1x, T4/T5 54.5x the DN
      activity) beats reading descending neurons -- under scrambled input.
    status: "null"
    evidence:
      - "sg-lc vs sg-g2-nolearn, complete: +0.0378, CI [-0.068,+0.150], p=0.526"
      - "sg-t4t5 vs sg-g2-nolearn, complete: -0.0280, CI [-0.163,+0.094], p=0.557"
      - "Under the bio-eye encoder this becomes H-RETINOTOPY-COLOUR."
    updated: 2026-09-23
  H-APL:
    statement: >
      Strengthening APL feedback inhibition -- the fly's own sparsification
      circuit -- restores biological KC sparsity (0.05-0.11) at a live
      operating point, where global gain provably cannot (KC->KC is 85.3% of
      KC input; the silent-to-latched transition is abrupt).
    status: supported
    evidence:
      - >
        Mechanism finding first: in a signed tanh network, inhibition cannot
        sparsify |abs| activity -- it drives cells negative, and |-0.4| counts
        as active. Measured: APL x4-x25 made |abs| sparsity WORSE (0.123 ->
        0.166-0.177, latching at ~0.95).
      - >
        On the positive lobe (firing; rates are non-negative) APL works exactly
        as the literature says: x1 0.123 (above band), x2 0.098, x4 0.078 (in
        band), plateau 0.077 at x10-25 because feedback self-limits. DN stays
        live. Scoping verified exact: sum|APL->KC| scales x4/x10/x25 to the
        digit, nothing else touched.
      - >
        Corollary implemented: eligibility is rectified (positive lobe only) --
        the previous |abs| eligibility counted an APL-inhibited KC as MORE
        eligible the harder it was suppressed.
    updated: 2026-09-23
  H-MB-INPUT-BUS:
    statement: >
      Driving the mushroom body through its real input pathway (antennal-lobe
      projection neurons -> Kenyon cells, 2 hops, reaches 4,025/4,064 KCs)
      gives the learning circuit sensory content, making a fair retest of
      H-MB-LEARNING possible. ARC has no odours, so any PN drive is a declared
      invention (assumption G): the claim is about the MB as associative
      memory, never about olfaction.
    status: open
    evidence:
      - >
        Built and live-probed 2026-09-23: PN activity 2.5e-05 -> 2.3e-01 with
        the bus on; KC patterns separate colour-9 from colour-3 screens by
        23-78%; reinforcement moves |dW|=3.6 through rectified eligibility.
        Input scale CALIBRATED to 0.003 at APL x4 (KC firing 0.091, in band);
        every naive scale saturated the KC pool via its 85% recurrence.
        Behavioural effect untested; awaiting the mb-done-right arms.
    updated: 2026-09-23

  H-COORDINATE-CONVENTION:
    statement: >
      Correcting the static online Python click head from its historical
      x-major flattening (x*64+y) to ARC's public coordinate convention
      (x=column, y=row; flat=y*64+x) improves prequential prediction robustly
      across the six development games enough to earn a behavioral A/B.
    status: refuted
    assumptions:
      - >
        ESTABLISHED: ARC ACTION6 payloads use x as column and y as row; the
        controller's scene code indexes the clicked cell as grid[y,x].
      - >
        MEASURED: every historical click-head arm used x*64+y, and the
        retinotopic saliency and fly-tiebreak paths contain the same transpose.
        The prior 0.551859 engineering baseline therefore belongs to the
        legacy arm and must not be relabelled as corrected.
      - >
        ASSUMPTION: prequential prediction on the exact clicks executed by the
        frozen sg-combo traces is a useful cheap gate for whether coordinate
        correction can improve online ranking. This is only a bridge to score,
        not a score result; a passing replay still requires a behavioral A/B.
      - >
        ASSUMPTION: cached public games replay the stored traces exactly under
        their recorded environment seeds. The script must verify every stored
        before/after observation SHA-256 and abort on the first mismatch.
    preregistration_2026_09_26:
      trivial_alternative: >
        A = legacy_xy_flat, the exact historical x*64+y extraction. It remains
        implemented and is never reconstructed by reverting source.
      intervention: >
        B = arc_row_major, changing only patch coordinate flattening to
        y*64+x. Learning rate, class balancing, cell-to-column map, action
        traces, labels, update order, seeds and all controller parameters stay
        fixed.
      development_slice: >
        sg-combo seeds 0-2 for ft09, lp85, r11l, tn36, vc33 and sp80. These
        six public games are deliberately score-bearing development endpoints,
        not held-out evidence of transfer.
      label: >
        For each executed ACTION6, any difference between the policy's source
        and destination 64x64 grids. Prediction is recorded before the online
        update. Non-click actions are replayed only to reconstruct state.
      primary_metric: >
        Mean per-row prequential binary log loss, rows weighted equally;
        corrected B must be lower than legacy A.
      robustness_metrics: >
        Median paired row delta must favor B; at least four of six game-level
        mean deltas must be <=0; aggregate average precision for B must be no
        worse than A. Degenerate single-class rows are excluded from average
        precision only and remain in log loss.
      kill_rule: >
        If exact replay coverage is incomplete, any observation hash differs,
        or any primary/robustness condition fails, stop this score branch. Keep
        the coordinate audit and do not launch a game battery.
      promotion_rule: >
        A replay pass earns only a focused behavioral A/B of the same Python
        click head: legacy sg-combo versus row-major sg-combo on these six
        games, seeds 0-2, 600 actions. Promote the correction only with no loss
        of total levels and improved paired first-level action cost, score, or
        an added level. This remains an engineering result, not FlyGI
        attribution. Correcting the neural retinotopic decoder and comparing
        real anatomy with a matched null is a separate hypothesis and must not
        be substituted for this intervention.
      command: >
        .venv/bin/python scripts/replay_click_coordinate_ab.py
        --rows results/connectome_agent/sg-combo.rows.jsonl
        --games ft09 lp85 r11l tn36 vc33 sp80
        --seeds 0 1 2
        --output results/connectome_agent/coordinate_convention_replay.json
      output: results/connectome_agent/coordinate_convention_replay.json
    evidence:
      - >
        MEASURED 2026-09-26 by the preregistered exact cached-trace replay:
        18/18 rows and all 10,800 action-step before/after frame pairs
        reproduced (21,600 individual hash comparisons); 9,422 executed clicks,
        8,877 labelled changed. Corrected B improved mean row log loss 0.144710
        -> 0.084567. Across the six nondegenerate rows (3,532 clicks), aggregate
        average precision improved 0.974304 -> 0.974420. The gain was
        concentrated in lp85 (game mean delta -0.354565) and ft09 (-0.033901).
      - >
        KILL RULE MET despite the aggregate gain: median paired row delta was
        +0.002365 rather than <0, and only 2/6 game-level means were non-worse
        rather than the preregistered >=4. The four all-positive games regressed
        slightly: r11l +0.003224, sp80 +0.017843, tn36 +0.002089, vc33
        +0.004450. No behavioral battery is launched and no promotion bar is
        amended after seeing the result.
      - >
        Local ignored result artifact at closure:
        results/connectome_agent/coordinate_convention_replay.json, SHA-256
        8ce8ca457c1374bf7e9bb539f9365f0885739643a0fbde6d308a25fb7fb94044;
        analyzer SHA-256
        9bc9a3bc6e713f15cc3abb9b80dc4388c4c6e4874a16159a86131e59b316d2d2;
        registry-at-run SHA-256
        6e7bcd3965f39459a4cdc452da9d25ae33a592bb1e81209e62f8c9bd8c22f92f;
        source sg-combo rows SHA-256
        ae5de86c1f5d8abe8fa19a5e66acad6b87944a1ef6a3ffc2abe88255fa7161ad;
        config SHA-256
        a0c595da8c572caca0dc1a3ca99de70f6d32193c41403554b9fd3b6f0770c542.
      - >
        VALIDATION CORRECTION before commit: the first local result incorrectly
        pooled 12 single-class rows into aggregate average precision despite
        their preregistered exclusion. It is preserved as
        coordinate_convention_replay.invalid-ap-v1.json (SHA-256
        04f816f524a5b4020d43df4ee95218e5c54defe114de1d303cc9d2d1adf8f90d),
        is invalid, and is not evidence. Row grouping plus a degenerate-row
        regression test fixed the analyzer; exact replay left log loss, game
        deltas, and the failed gate unchanged.
    updated: 2026-09-26

  H-RETINO-DECODER:
    statement: >
      HISTORICAL, INVALIDATED INTERFACE CLAIM: legacy-transposed click
      coordinates read from optic-lobe state appeared to convert a measured
      localization gap into behaviour. The joint state readback measured 0.8
      cells versus 23.5 for the deployed body-id-block head and 37.2 for chance;
      the wired surprise readback measured 3.5 cells versus 12.1 for
      state_change. Python, not fly neurons, produced the surprise quantity by
      differencing a frozen-reference trajectory from the actual trajectory.
      These measurements remain historical facts under their protocol, but the
      swapped ARC axes invalidate them as evidence for a correctly registered
      decoder or a neural forward model.
    status: invalidated
    evidence:
      - "Localization measured offline and through the wired path, 2026-09-23"
      - >
        AUDIT 2026-09-26: the decoder returns grid row/hex1 as x and
        column/hex2 as y, while ACTION6 and scene extraction use x=column,
        y=row. Its tests encoded the same swap. The measured legacy-transposed
        behavior remains real, but it does not test the correctly registered
        retinotopic decoder. A separate neural-decoder hypothesis must own that
        recovery; H-COORDINATE-CONVENTION tests only the Python click head.
      - >
        sg-bioeye-lc-retdec vs sg-bioeye-lc, 75 matched rows, preregistered
        endpoints: score HURTS at every endpoint (full -0.159 [-0.364,-0.003]
        p=0.126; click-19 -0.209; click-dominant-9 -0.444) while LEVELS RISE
        everywhere (21v16, 20v15, 14v9). Measured localization converted to
        breadth, not score: better click targeting opened more first levels on
        more games and lost more points than it gained. The surprise variant was
        killed at 19/75 as a priority decision (its primary contrast was vs
        retdec; no decision hinged on it post-pivot) -- killed, not falsified.
    updated: 2026-09-26

  H-RETINO-SURPRISE-RECURRENCE:
    statement: >
      On the fixed registered panel, ARC-correct external decoding of the
      difference between an unchanged-background counterfactual rate-state and
      a local-change rate-state from the real MaleCNS runtime has global median
      error <=4 ARC cells, is strictly better than the legacy transpose at all
      8 paired centers, has global median error <=80% of both one registered
      degree-preserving normalized rewire and recurrence-off, and is strictly
      better than each control at >=7/8 paired centers.
    status: refuted
    assumptions:
      - >
        ESTABLISHED: ARC ACTION6 defines x as grid column and y as grid row.
        The categorical retinotopic encoder maps grid row to MaleCNS hex1 and
        grid column to hex2, so the inverse decoder must return x from hex2 and
        y from hex1. This correction is a contract, not a fitted hypothesis.
      - >
        MEASURED before preregistration: the real and null runtimes each have
        166,700 nodes and 24,994,595 nonzero edges. The null preserves every
        in/out degree and the signed-weight multiset before required incoming-L1
        re-normalization; after normalization, signed support/counts, degrees,
        and the incoming-L1 contract match, but final weight magnitudes do not.
        The loaded matrices share 0.561% of edges. Their retinotopy,
        node-metadata, and group assets are byte-identical.
      - >
        ASSUMPTION AND CLAIM BOUNDARY: the encoder directly drives 23,720
        ol_intrinsic neurons spanning 892 annotated eye columns and arbitrarily
        repurposes 15 L/Mi/Tm/C/T cell-type identities as ARC categorical-colour
        bins; the decoder reads those same driven neurons. A pass would show
        that recurrence sharpens this engineered retinotopic code. It would not
        establish natural fly colour physiology, vision, or perception.
      - >
        ASSUMPTIONS A-D, FROZEN ENCODER: cell-type channels are ordered by
        sorted type name; ARC colour c selects channel c % 15; drive magnitude
        is fractional colour occupancy within each affine-mapped eye column;
        all drive is positive; input_scale=1.0; there is no changed-cell
        channel and no colour permutation. These rules target exactly the
        23,720 indices in the hashed retinotopy asset. They are engineered
        choices, not measured fly feature semantics; if they are wrong, this
        assay may reject useful biology presented through a bad interface.
      - >
        MODEL LIMITATION: the runtime uses heuristic transmitter signs,
        modulators-as-positive, unknown transmitters as zero, incoming-L1
        normalized weights, synchronous tanh rates, and no cell-type-specific
        kinetics or delays. A result applies to this MaleCNS-derived rate model,
        not to the living CNS.
      - >
        ASSUMPTION: four repeated background observations (each K=4 internal
        updates) establish enough state for a one-step no-world-change
        expectation. This is frozen rather than calibrated; if it is too short
        or too long, the probe may miss a usable circuit regime.
      - >
        ASSUMPTION: the existing untrained sum-pooling of per-neuron absolute
        surprise into hex-axis bins is adequate plumbing. It is held identical
        across graph conditions. If neuron-count imbalance dominates it, the
        absolute-localization gate should fail and no alternative pooling is
        tried in this branch.
      - >
        ASSUMPTION: synthetic local-change localization is a useful prerequisite
        for score-facing click selection. It is not itself ARC behavior or a
        score result; even a pass earns only a separately preregistered
        score-adjacent gate.
      - >
        LIMITATION: the one registered null seed is sufficient only for this
        cheap premise killer. Null seeds, not centers or colour trials, are the
        replication units for a graph-organization inference. This null keeps
        node degrees but not cell-type, neuropil, or eye-column blocks, and the
        final rowwise rescaling differs. A pass cannot isolate predictive coding
        or retinotopic microcircuitry and cannot support a robust anatomy claim.
    preregistration_2026_09_26:
      trivial_alternatives: >
        Legacy-real keeps the historical hex1->x, hex2->y transpose as a
        mechanical defect reference; it decodes the same real neural traces,
        rather than rerunning a fourth dynamical condition.
        Corrected-recurrence-off directly instantiates the real matrix and
        identical sensory/readout plumbing with recurrent gain 0, so sensory
        drive and leak remain but W contributes zero. Corrected-null uses the
        existing directed-degree-preserving normalized rewire, seed 20260921.
        Only corrected-real may earn promotion.
      frozen_physiology: >
        Float32 synchronous rate updates use
        h <- (1-a)h + a*tanh(g*W*h + u + b), with W[post,pre], a=0.3, b=0,
        deterministic all-zero h0, and the same input u held fixed for each of
        K=4 internal steps. Gain g=2.0 for real/null and 0.0 for
        recurrence-off. The off condition must use the byte-identical real CSR
        and differ from corrected-real only in effective gain. No learning,
        efference, reclick memory, controller, click head, state tags, taxis,
        or loop escape. The standalone probe never constructs or calls
        action/controller paths, so inherited action-layer fields such as
        loop_escape_enabled are inert and must be recorded as such rather than
        changed in the single-delta config.
      stimulus_panel: >
        Eight off-diagonal ARC (x,y) centers selected from the retinotopy asset
        without neural-outcome inspection: (12,32), (32,12), (22,44), (44,22),
        (20,49), (49,20), (13,42), (42,13). Every stimulus is a 64x64 grid whose
        background is entirely from_colour. The inclusive 5x5 changed patch is
        written exactly as grid[y-2:y+3, x-2:x+3] = to_colour. Every center maps
        to an occupied fly-eye column and its patch spans 6-12 occupied keys.
        At each center, run ordered categorical changes 1->7, 7->1, 3->12, and
        12->3. The same 32 deterministic changed stimuli run under each of three
        dynamical conditions, for 96 changed condition-trials. Legacy is only a
        second decode of the 32 real traces, not a fourth neural run. These four
        colours address distinct declared encoder channels. Run exactly three
        no-change condition-trials: one all-colour-1 check under each of real,
        null, and recurrence-off.
      state_protocol: >
        For each from-colour and condition, start h0=0 and advance four
        identical uniform-background observations. Reuse that exact h4 across
        centers with the same from-colour. Expected and actual must each start
        from byte-identical copies of h4. From those copies, compute expected by
        one advance on the unchanged background drive and actual by one advance
        on the registered changed grid. Python then computes
        abs(actual-expected) on retinotopically annotated neurons only. The two
        states are produced through fly dynamics; the subtraction, pooling, and
        coordinate argmax are external assay plumbing, not fly-neuron
        computation or evidence of a biological forward model.
      decoder_contract: >
        The new fail-closed enum has exactly legacy_hex1_x and arc_x_hex2.
        Historical configs default to legacy_hex1_x. Existing per-axis bin sums
        remain unchanged. Legacy-real returns (hex1 scores, hex2 scores);
        corrected conditions return (hex2 scores as ARC x, hex1 scores as ARC
        y). Prediction is NumPy argmax on each axis, whose tie rule is the
        lowest index. Error is Euclidean distance in ARC cells to the declared
        (x,y) center.
      reduction: >
        Within each condition and center, reduce the four colour-transition
        errors to their standard median, the average of the middle two after
        sorting four values. For every reported global median, take the same
        standard median of the eight center-level medians. All gates use raw
        unrounded values. The eight centers are fixed paired deterministic
        evaluation cases, not independent samples; the four mirrored pairs and
        shared from-colour h4 states forbid a binomial or sign-test
        interpretation. Per-transition summaries are reported for diagnosis
        but are not separate confirmatory endpoints.
      threshold_provenance: >
        ASSUMED: <=4.0 ARC cells is a prior-calibrated usefulness bar based on
        the historical approximately 3.5-cell legacy assay; <=80% of a control
        is an assumed minimum meaningful effect. Strict improvement over legacy
        at all 8 centers allows zero exceptions because a coordinate-contract
        repair should consistently correct every registered off-diagonal case;
        strict improvement over each neural control at >=7/8 allows one
        center-specific exception while demanding broad descriptive
        consistency. Both counts are assumed robustness bars, not calibrated
        probabilities. The historical trial coordinates and colours were not
        durably recorded, so panel disjointness cannot be certified. This is a
        preregistered developmental retest, not an independent replication or
        confirmation.
      config_contract: >
        The corrected config's parsed dataclass values differ from its parent
        exactly at future.experiment.name and
        decoder.retinotopic_coordinate_convention. Historical default is
        legacy_hex1_x. The probe asserts action/controller paths are not
        constructed, so inherited loop-escape settings are inert.
      contract_gate: >
        An exactly round-trippable off-diagonal golden at
        grid(row=20,column=50) must return legacy (x=20,y=50) and corrected
        (x=50,y=20). Under the real 36x39 affine eye spans it maps to occupied
        (hex1=12,hex2=31), containing 26 annotated neurons. The initially
        proposed row=13,column=50 is forbidden: its marginal bins exist, but
        their joint pair (hex1=8,hex2=31) is unoccupied, so it cannot be a
        real-asset golden. The probe must verify the config contract; real/null
        graph, manifest, and asset hashes; null invariants; the byte-identical
        real CSR/hash in real and recurrence-off; gain as the only effective
        difference between those two networks; identical drive SHA-256 across
        real, null, and recurrence-off for every trial; byte-identical h4 forks;
        exactly zero no-change state difference and axis sums; every changed
        trial finite in both axes with total saliency >0 in
        real/null/recurrence-off; reclick_memory=none; inert action paths; and
        immutable-output refusal before graph loading or any verdict. Null
        invariants are exactly 24,994,595 edges, 166,700 nodes,
        zero duplicate/self edges, exact real/null in- and out-degree arrays,
        15,180,624 positive and 9,813,971 negative final weights in each,
        identical node IDs, valid/reached-target manifest flags, source-graph
        SHA matching real, and 389 zero-incoming rows plus maximum nonzero-row
        |L1-1| <=3e-4 after normalization.
      coordinate_repair_gate: >
        Corrected-real global median center error must be <=4.0 ARC cells and
        corrected-real must be strictly lower than legacy-real at all 8 paired
        centers.
      single_null_dependency_gate: >
        Corrected-real must independently beat corrected-null and
        corrected-recurrence-off: its global median center error must be <=80%
        of each control's global median, and it must have strictly lower center
        error at >=7/8 paired centers against each. Ties are not wins. Seven of
        eight is a frozen descriptive consistency bar, not a p-value.
      outcome_mapping: >
        Contract failure makes the experiment invalid and yields no scientific
        verdict. If every contract check passes but either scientific gate
        fails, the fixed-panel hypothesis fails and this branch stops. A full
        pass supports the claim only on this fixed panel and single normalized
        rewire; it is not a general anatomy or biology result.
      implementation_contract: >
        The convention value must reach every RetinotopicSaliency construction
        path in FlyTiebreaker, including the primary coordinate source and the
        surprise-reclick helper. describe() must report the active convention
        separately from the historical measurement convention. Module prose
        must say unnormalized bin sums, not means, and a regression test must
        prove that switching convention only swaps the two existing score
        arrays byte-for-byte. The registered child uses reclick_memory=none;
        unrelated legacy griddiff-memory indexing is outside this branch.
      kill_rule: >
        Every contract, coordinate-repair, and single-null-dependency check is
        conjunctive. If any check fails, record the result, keep the explicit
        compatibility flag/goldens, and stop: no threshold change, alternative
        pooling, state_change substitution, new stimulus locations,
        score-facing replay, or ARC behavior battery in this branch.
      promotion_rule: >
        A full pass establishes only the registered synthetic single-null
        recurrence premise. It earns
        a new preregistration for the smallest frozen ARC click-transition
        assay with the Python click head and controller disabled. It does not
        earn a score claim, an anatomy headline, or a Kaggle submission.
      expected_outcome: >
        EXPECTED before running: the mechanical axis correction should pass,
        but recurrence-off may match real because the decoder directly reads
        driven optic-lobe neurons. Score-adjacent predictions in this repository
        are 0-for-12, so no positive score outcome is forecast.
      command: >
        FLYGI_SPMV_THREADS=6 .venv/bin/python
        scripts/probe_retinotopic_decoder.py
        --config configs/literal_rate_bioeye_lc_surprise_arcxy.yaml
        --real-runtime data/processed/male-cns-v1.0/literal-rate-signed-modulators
        --null-runtime
        data/processed/male-cns-v1.0/literal-rate-signed-modulators/nulls/degree_preserving/seed-20260921
        --output results/connectome_agent/retino_surprise_arcxy_probe.json
        --require-promotion
      output: results/connectome_agent/retino_surprise_arcxy_probe.json
      artifact_contract: >
        After reserving a new output path, always write an immutable result
        envelope before returning, including invalid contract outcomes. Record
        every per-trial value, center/transition/global reduction, and gate
        boolean; probe and EXPERIMENTS-at-run SHA-256; parent and child config
        SHA-256; real/null manifest, graph, retinotopy, node-metadata, and group
        hashes; effective rate parameters and equation; thread count;
        Python/NumPy/SciPy versions; Git commit and dirty state; active decoder
        convention; and whether action paths were constructed. Refuse an
        existing output before graph load and never overwrite it. With
        --require-promotion, return 0 only for a full pass, 2 for a
        contract-valid scientific failure, and 1 for an invalid contract or
        runtime failure. Focused tests must cover unknown-enum rejection,
        historical default compatibility, both FlyTiebreaker construction
        paths, semantic config diff, argmax ties, 7/8 counting, invalid-contract
        artifacts/exit status, and pre-load output refusal.
