      - >
        CLASS 2.5 MEASURED 2026-09-30 (scripts/benchmarks/
        fc25_visual_ds.py; flyvis 1.2.0 released ensemble, task-
        optimal cluster n=31, provenance and unit mapping verified
        against the package source): T4/T5 DIRECTION SELECTIVITY
        PASSES ITS BAND on the MaleCNS patch -- pooled median DSI
        0.3216 (band 0.30), T4 four distinct preferred directions,
        T5 three. ATTRIBUTION NUANCE, measured two-sided: trained
