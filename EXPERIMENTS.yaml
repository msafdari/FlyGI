  H-LC-RECOGNIZER:
    statement: >
      The fly's releaser circuits -- LC/LPLC visual projection neurons
      (4,674 in the compiled graph) and the lateral horn (2,028), the
      populations that in the animal recognize a visual context and
      trigger the matching stereotyped program -- can serve as the
      fixed-action-pattern library's RECOGNIZER: their population codes
      identify a never-seen game's class from frames, with the eye map
      load-bearing (real retinotopy beats the scrambled-encoder twin).
    status: refuted
    evidence:
      - >
        KILLED BY ITS PREREGISTERED CONDITION 2026-09-27
        (scripts/lc_recognizer_premise.py, scripts/lc_recognizer_linear.py;
        results/recognizer_premise.json, recognizer_premise_linear.json).
        Protocol: 40 random-play frames x 25 games, stateless gain-2.0
        advance, LC-family and LH population vectors; arms real bio-eye
        vs the established scrambled sparse-projection twin (identical
        readout and graph); trivial alternative a 1,024-dim raw-grid
        block histogram. Endpoint 1, 25-way game ID: CEILING for every
        reader including the trivial baseline (1.0 everywhere) --
        discriminates nothing. Endpoint 2 (preregistered replacement,
        declared before any verdict): held-out-GAME dead-vs-live.
        Nearest centroid: every reader at or below chance (real LC
        0.367, real LH 0.320, scrambled LC 0.546, raw 0.520). Final
        preregistered escalation, an L2 logistic probe, leave-one-game
        out, identical pipeline for all arms: real LC 0.438, real LH
        0.520, scrambled LC 0.510, scrambled LH 0.579, raw baseline
        0.415, chance 0.5 -- the real arms beat NEITHER their scrambled
        controls NOR chance. SCOPE, stated precisely: under this
        protocol (single frames, training-free or linear decoders,
        dead-vs-live class of a held-out game) no reader carries the
        class, and the eye map contributes nothing detectable; the kill
        is for THIS recognizer role. Game IDENTITY (seen games) is at
        ceiling for everyone -- frames are individually distinctive but
        their class is behavioural, not visual. No further decoder
        shopping on this question, per the escalation's registration.
        CONSEQUENCE: if the FAP library is built, its recognition stage
        is engineered parsing (like the programs and the taxis machinery
        before it) and earns the fly no credit; the fly's load-bearing
        seat remains the retinotopic click head.
    updated: 2026-09-27

  H-DEFRAG-NOVELTY:
    statement: >
      Similarity-aware novelty (locality-sensitive tags over bio-eye
      features dampening near-duplicate "novel" states) converts to the
      breadth endpoint the hidden set pays: more levels on more games than
      the champion, without the head arms' breadth harm.
