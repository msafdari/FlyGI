    evidence:
      - >
        TREATMENT MEASURED 2026-09-25 (sg-defrag-tags, 75 rows): levels 24
        vs champion 21 -- the FIRST arm to exceed the champion's level
        count (historical band 14-22); score 0.2733 vs 0.2034; breadth
        10/25 (gained g50t, lost r11l). Mechanism engagement: median 329
        of ~600 per-row "novel" states dampened as near-duplicates.
        HONEST PAIRED READING at n=3 seeds: levels +8/-5/=62 rows; score
        Wilcoxon p=0.097; the gain concentrates in g50t (+2.50/game) and
        WITHOUT it the score delta is -0.03 -- fails the largest-game
        robustness check; r11l HARMED (-1.60): dampened novelty removes
        the exploration pressure that solved it. Verdict pending: the
        permuted-retinotopy twin (fly attribution) and targeted stability
        seeds (g50t/lf52/ar25/r11l x seeds 3-8, both arms) decide whether
        this is the first real breadth mechanism or seed noise.
        INTERACTION NOTED for a later arm: defrag's harm (r11l) is the
        click head's biggest win and vice versa -- the mechanisms' costs
        are disjoint, so the combination arm is the registered follow-up
        if both survive attribution.
      - >
        ATTRIBUTION TWIN MEASURED 2026-09-25 (sg-defrag-tags-permuted, 75
        rows): FLY NOT LOAD-BEARING in this mechanism. The scrambled-map
        twin also beats the champion -- 22 levels / 0.3215 vs champion 21
        / 0.2034 -- and sits within seed noise of the real-map arm (24 /
        0.2733); dampening engagement near-identical (346 vs 329 median).
        Near-duplicate detection at threshold 0.9 survives any consistent
        featurization; the eye-map's spatial coherence is not the active
        ingredient. TWO consequences, stated separately per the first
        principle: (1) the DEFRAG MECHANISM claim STRENGTHENS -- two
        independent draws above the historical level band (24, 22 vs
        14-22) -- as a SCAFFOLD improvement, recorded as engineering, not
        dressed as a fly result; (2) as a submission candidate defrag
        alone fails the fly-load-bearing gate. The registered shippable
        composition remains defrag (scaffold) + retinotopic click head
        (fly-advantage measured): breadth from the first, fly-load-bearing
        efficiency from the second. Stability seeds in flight decide
        whether the breadth gain is real before any combination arm runs.
      - >
        STABILITY CONFIRMED 2026-09-25 (seeds 3-8, four moved games,
        paired): defrag 19 levels vs champion 12 (+58%), winning g50t
        (4v2), lf52 (6v2), ar25 (6v4); r11l "harm" was noise (score 13.21
        vs 8.22, defrag WINS on fresh seeds). Score-sum 28.31 vs 8.57
        (3.3x). FIRST mechanism in this project to replicate its gains on
        fresh seeds. Status moves to supported AS ENGINEERING (fly-parity
        recorded). The combination arm (combo_defrag_clickhead.yaml:
        defrag tags + retinotopic deadline head) launches under the
        ORIGINAL un-overridden ship bars: A no-harm vs champion on levels
        AND score, B fly load-bearing via the head's already-measured
        twin pair, C packaging replay.
    updated: 2026-09-25
  H-CX-CALIBRATION:
    statement: >
      Circuit-level calibration (the H-APL pattern) can transplant the
      compass's measured working regime (~gain 1.5) into the deployed
      gain-2.0 agent by scaling CX-internal edges, giving the deadline
      agent a functioning steerable ring.
    status: refuted
    evidence:
      - >
        BUILT AND MEASURED 2026-09-25 (circuit.cx_compass_gain knob,
        default 1.0 = identity, 406 tests pass; results/
        cx_calibration_insitu.json, _sweep.json, _extended.json). The
        causal chain, complete: (1) whole network at gain 1.5 -> ring
        works (tight bump, opposite-signed steering); (2) intra-compass
        edges scaled 0.4-0.75 inside the gain-2.0 network -> localization
        improves monotonically (circvar 0.51-0.60) but steering stays
        same-signed at every value; (3) intra PLUS all external->compass
        input scaled 0.75 (29k edges) -> still same-signed. CONCLUSION:
        the ring's STEERABILITY is a global-regime property of the
        compiled dynamics -- the PEN velocity pathway functions only when
        the surrounding network also runs near gain 1.5 -- and cannot be
        transplanted by circuit-local calibration. Per AGENTS.md rule 4
        this is recorded as a real limit and the attempt stops here; the
        knob remains as the measuring instrument (default identity). The
        deployed agent is unchanged. The compass's persistence (anatomy-
        specific, H-CX-RING-ATTRACTOR) still stands; its steering exists
        only in a whole-brain regime the visual pathway cannot occupy.
    updated: 2026-09-25
