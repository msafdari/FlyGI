      same restriction. WASHOUT: W set by the ESP convergence test (two
      initial states, zeros vs seeded random; criterion: normalized state
      distance < 1e-3 sustained; if unconverged by frame 50, results are
      per-trajectory and claim language weakens accordingly); perturbation
      growth reported either way. ARMS: real N_t (29,291); B0a copy floor
      (y_hat = y_t, zero parameters); B1 = y_t; B2-L = [y_t..y_{t-L+1}] for
      L in {1,2,4,8}, medium tier scored against the BEST B2-L; B2' = fixed
      random tanh expansion of the L=4 embedding to 29,291 dims, 3 R seeds;
      history oracle = B2-L8 (leakage red flag if N_t beats it); B3 = same
      probe on the degree-preserving null of the MODULATORS graph, seed
      20260921, SINGLE null draw (registered as such); B4 = empty-CSR bypass,
      same code path (caveat registered: LC/DN dims are structurally zero
      without recurrence; B4 reported with and without them; beating one
      leak constant supports "recurrent wiring adds predictive content", not
      the full multi-timescale claim). PROBE: dual/Gram ridge; per-feature
      z-score with 1e-8 floor and per-target centering fitted on train games
