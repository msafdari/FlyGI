  H-FAP-PROGRAMS:
    statement: >
      The dead games' level 1 really is a short exact program derivable
      from the displayed goal -- so a fixed-action-pattern library
      (recognize the archetype, release the program) can convert games
      that every battery arm has scored 0.00 on.
    status: supported
    evidence:
      - >
        PREMISE-KILLER PASSED 2026-09-27, BOTH TEMPLATE-FLAVOUR GAMES
        (scripts/fap_program_premise.py, hand-derived programs executed
        against the strict-offline arcade; trivial alternative random
        play, measured 0 levels on these games in every 600-action row
        ever run). FT09: the screen is four 3x3 tile grids whose centre
        glyph is a MINIATURE OF ITS OWN GRID (glyph colour 2 = tile 9,
        glyph 0 = tile 8; verified exactly on all three reference
        grids); the bordered grid's glyph mismatches its own all-9
        surround and is the goal -- clicking the four tiles its 0-cells
        prescribe completes level 1 in FOUR actions (score 0->1), and
        the same rule read off level 2's two glyphs (marked colour c)
        completes level 2 in seven more (score 1->2). SC25: punch the
        die's pip pattern into the 3x3 board (0-cells mark the pips;
        clicking a 2-cell costs a timer tick, a 0-cell does not), the
        oversized track marker then SHRINKS to 2x2 and can pass the
        track notch, and rolling it left to the docking box completes
        level 1 in ~17 actions (score 0->1). Programs recorded in this
        entry; instruments committed.
      - >
        MEASURED ENGINE QUIRK, sc25 only (verified absent in ft09): the
        first action after every RESET -- including episode start -- is
        swallowed completely, identical frames regardless of which
        action wakes it. Every deployed agent burns one action per sc25
        life, and the consequence head's teaching signal records that
        action as effect-free. scripts/fap_bfs_probe.py carries a --wake
        flag for it.
      - >
        SCOPE, stated at registration: the programs are ENGINEERED
        scaffold, like the taxis machinery before them -- the fly
        earns no credit for executing them. The registered fly seat is
        RECOGNITION (H-LC-RECOGNIZER): which archetype a never-seen
        game belongs to. BFS over the offline arcade
        (scripts/fap_bfs_probe.py) measured sc25's directional-only
        state space at 19 states (exhausted, no win) and the click
        space at 5,031+ states (3,000-node cap, no win at depth <=4),
        so blind search does NOT replace goal reading: the programs
        must be derived from the displayed goal, which is exactly the
        recognizer-plus-program shape the library plans.
      - >
        FIRST TWO LIBRARY ENTRIES BUILT AND MEASURED 2026-09-27
        (src/flygi/controller/fap_library.py; scripts/fap_solver_eval.py,
        results/fap_solver_eval.json; parser unit tests in
        tests/test_fap_library.py). Solver-driven offline play, no
        agent: FT09 completes levels 1-2 autonomously (the glyph
        parser generalizes across marked colours 8 and c); level 3
        satisfies the measured rule completely yet does not fall --
        four glyphs on a 7x5 cross lattice, every prescription met, no
        win -- so level 3 encodes an additional rule, recorded as the
        entry's current boundary, NOT tuned blind. SC25 completes
        levels 1-2 autonomously (punch pips, then roll toward the
        detected dock -- level 2's track is vertical; at arrival the
        marker merges with the dock and one more roll in the
        remembered direction finishes, so the archetype keeps the last
        known-good direction); level 3 introduces a door/key element
        ('d' block gating the dock, a keyed display) beyond the
        archetype -- recorded boundary. ABSTENTION AUDIT, all 25 games
        at budget 300: the library emitted ZERO actions and matched
        nothing on the other 23 games, no crashes -- seating it costs
        the champion nothing by construction. EXTENDED SAME DAY: the
        glyph rule's full two-sided form (0-cells take the glyph's
        marked colour, 2-cells take the OTHER palette colour) was
        measured on level 3's violation and completes ft09 LEVELS 1-4
        in 46 solver actions; stall and frame-revisit guards make a
        stuck solver abstain instead of burning the timer life
        (measured failure mode on ft09 level 5), and with the guards
        the sc25 stack reaches LEVEL 3 (solver + random fallback
        breaking the door impasse). Trivial-alternative comparison:
        random play's all-time record on ft09/sc25 is 0 levels; the
        stack's is 4 + 3.
