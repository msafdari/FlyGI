# The experiment league: every condition, every hypothesis, one file.
#
# This is the project's central claim-tracker. `scripts/league.py` joins it
# against the immutable result bundles, the live checkpoints and the telemetry
# to render the leaderboard; nothing here duplicates a number that an artifact
# already holds. What this file owns is the part no artifact can derive:
# WHY each experiment exists, WHAT it is fairly compared against, and WHICH
# hypothesis its result moves.
#
# Rules, enforced by scripts/league.py where it can:
# - Every experiment names the condition string inside its result bundle.
# - Comparisons are valid only within the same regime. gain0.9 results were
#   measured on a network whose readout sat one significant digit above float32
#   epsilon (WORKLOG section 8); they are a record of that dead regime, not
#   baselines for anything since.
# - Hypothesis statuses move on evidence, with the experiment named. `open`
#   means untested, `null` means tested and no effect found, `invalidated`
#   means the test itself was later shown unsound -- which is not the same as
#   the hypothesis being false, and the note must say why.

schema_version: 1

regimes:
  gain0.9-dead:
    note: >
      Deployed operating point until 2026-09-23. Post-sensory activity ~2.6e-6,
      ~22x float32 epsilon; the whole regime is a measurement of numerical
      noise. Kept as history.
  gain2.0-modulators:
    note: >
      Operating point from WORKLOG section 9: -modulators graph (dopaminergic
      pathway present), recurrent_gain 2.0, readout ~5000x above epsilon. KC
      sparsity 0.123 vs biological 0.05-0.11, a declared compromise (H-APL).
  controller-only:
    note: Uses no connectome, so it is valid as a reference in every regime.

# Named game subsets for preregistered endpoints. The analyzer reads these;
# nothing else may duplicate them. Membership was measured on sg-g2-nolearn
# action counts and declared before any decoder arm ran a row.
endpoints:
  click_games_19:
    note: every game in which ACTION6 occurs
    games: [ar25, bp35, cd82, cn04, dc22, ft09, ka59, lf52, lp85, m0r0, r11l,
            s5i5, sb26, sc25, sk48, sp80, su15, tn36, vc33]
  click_dominant_9:
    note: games where ACTION6 is >60% of actions
    games: [bp35, dc22, ft09, lp85, r11l, s5i5, su15, tn36, vc33]
  full_25:
    note: the complete public set
    games: [ar25, bp35, cd82, cn04, dc22, ft09, g50t, ka59, lf52, lp85, ls20,
            m0r0, r11l, re86, s5i5, sb26, sc25, sk48, sp80, su15, tn36, tr87,
            tu93, vc33, wa30]

hypotheses:
  H-ANATOMY-TIEBREAK:
    statement: >
      The connectome breaking the controller's ties beats the controller's own
      deterministic hash.
    status: "null"
    evidence:
      - "sg-fly-real vs sg-controller-only: levels exactly tied 20-20, score +0.0216, p=0.835"
    updated: 2026-09-23
  H-STATE-DEPENDENCE:
    statement: >
      Any observation-dependent tiebreaker helps; the fly would be incidental.
      (The deflationary reading of the fly's early partial lead.)
    status: refuted
    evidence:
      - "sg-fly-gridhash: 9 levels vs controller's 20; noise in the same seam actively hurts"
    updated: 2026-09-23
  H-BUDGET:
    statement: Score is limited by the 600-action budget.
    status: refuted
    evidence:
      - "sg-fly-real-1800: zero level completions after action 600 across 21 matched rows"
    updated: 2026-09-23
  H-MB-LEARNING:
    statement: >
      Controller-supplied reinforcement through KC->MBON depression improves
      score.
    status: "null"
    evidence:
      - "sg-g2-learn vs sg-g2-nolearn: flat (0.203451 vs 0.203443, fewer levels)"
      - >
        First test unsound: Kenyon cells received 0.00% sensory input.
      - >
        FAIR retest 2026-09-24 (sg-mbdr-learn vs sg-mbdr-nolearn, 75 matched
        rows, every precondition verified present -- PN bus with 23-78% scene
        separation, biological KC sparsity, rectified eligibility, efference
        copy with 144% action separation): -0.0004, CI [-0.001,+0.000],
        p=1.000; levels 15 v 16, breadth 6 v 7. Null, cleanly. With a ~31:1
        punishment-dominated signal over 600-action episodes, KC->MBON
        depression moves real weight and changes essentially nothing the
        controller acts on. Controls stay unlaunched per the preregistered
        gate. Note also: the mbdr circuit itself (nolearn) costs breadth
        locally vs plain g2-nolearn (7/25 vs 10/25) -- the bus/APL/efference
        package is behaviourally negative-to-null on this scaffold.
    updated: 2026-09-24
  H-OPERATING-POINT:
    statement: >
      Waking the network from the numerical floor (gain 0.9 -> 2.0 on the
      -modulators graph) improves score by itself.
    status: "null"
    evidence:
      - "sg-g2-nolearn vs sg-controller-only: +0.0088, p=0.8625"
      - "The defect was real (22x -> ~5000x epsilon) and fixing it was necessary; it was not sufficient."
    updated: 2026-09-23
  H-RETINOTOPY-COLOUR:
    statement: >
      An input that preserves both retinotopy and categorical colour lets the
      fly's visual hierarchy (T4/T5, LC) do work that the scrambled projection
      made impossible.
    status: "null"
    evidence:
      - "Encoder verified: adjacency preserved, colours categorical, T4/T5 pattern change 3.41x for motion"
      - >
        sg-bioeye-lc vs sg-lc, 75 matched rows: +0.009151, CI [-0.125, +0.172],
        p=0.817, levels exactly tied 16-16. The partial had drifted to +0.072 at
        59 rows and collapsed in the final 16 -- the third occurrence of this
        seed-ordered mirage. t4t5 arm pending; status set on the LC result.
    updated: 2026-09-23
  H-COLOUR-MAP:
    statement: >
      The colour->type rule (c % 15) is harmless convention; only the
      categorical-plus-retinotopic structure matters, not which medulla type
      carries which colour. (Assumption A of the encoder.)
    status: supported
    evidence:
      - >
        sg-bioeye-lc-permuted vs sg-bioeye-lc, complete: +0.022, CI
        [-0.108,+0.198], p=0.974 -- null, as preregistered. The colour->type
        assignment is harmless convention.
    updated: 2026-09-23
  H-PERCEPTION-READOUT:
    statement: >
      Reading high-signal perception populations (LC 16.1x, T4/T5 54.5x the DN
      activity) beats reading descending neurons -- under scrambled input.
    status: "null"
    evidence:
      - "sg-lc vs sg-g2-nolearn, complete: +0.0378, CI [-0.068,+0.150], p=0.526"
      - "sg-t4t5 vs sg-g2-nolearn, complete: -0.0280, CI [-0.163,+0.094], p=0.557"
      - "Under the bio-eye encoder this becomes H-RETINOTOPY-COLOUR."
    updated: 2026-09-23
  H-APL:
    statement: >
      Strengthening APL feedback inhibition -- the fly's own sparsification
      circuit -- restores biological KC sparsity (0.05-0.11) at a live
      operating point, where global gain provably cannot (KC->KC is 85.3% of
      KC input; the silent-to-latched transition is abrupt).
    status: supported
    evidence:
      - >
        Mechanism finding first: in a signed tanh network, inhibition cannot
        sparsify |abs| activity -- it drives cells negative, and |-0.4| counts
        as active. Measured: APL x4-x25 made |abs| sparsity WORSE (0.123 ->
        0.166-0.177, latching at ~0.95).
      - >
        On the positive lobe (firing; rates are non-negative) APL works exactly
        as the literature says: x1 0.123 (above band), x2 0.098, x4 0.078 (in
        band), plateau 0.077 at x10-25 because feedback self-limits. DN stays
        live. Scoping verified exact: sum|APL->KC| scales x4/x10/x25 to the
        digit, nothing else touched.
      - >
        Corollary implemented: eligibility is rectified (positive lobe only) --
        the previous |abs| eligibility counted an APL-inhibited KC as MORE
        eligible the harder it was suppressed.
    updated: 2026-09-23
  H-MB-INPUT-BUS:
    statement: >
      Driving the mushroom body through its real input pathway (antennal-lobe
      projection neurons -> Kenyon cells, 2 hops, reaches 4,025/4,064 KCs)
      gives the learning circuit sensory content, making a fair retest of
      H-MB-LEARNING possible. ARC has no odours, so any PN drive is a declared
      invention (assumption G): the claim is about the MB as associative
      memory, never about olfaction.
    status: open
    evidence:
      - >
        Built and live-probed 2026-09-23: PN activity 2.5e-05 -> 2.3e-01 with
        the bus on; KC patterns separate colour-9 from colour-3 screens by
        23-78%; reinforcement moves |dW|=3.6 through rectified eligibility.
        Input scale CALIBRATED to 0.003 at APL x4 (KC firing 0.091, in band);
        every naive scale saturated the KC pool via its 85% recurrence.
        Behavioural effect untested; awaiting the mb-done-right arms.
    updated: 2026-09-23

  H-RETINO-DECODER:
    statement: >
      Click coordinates read retinotopically from the optic-lobe state (the
      inverse of the encoder's column map) convert a measured 30x localization
      gap into behaviour: the state localizes a known change to 0.8 cells
      (joint readback) while the deployed body-id-block head reads the same
      state at 23.5 cells, chance 37.2. Surprise variant: the reference is the
      frozen connectome advanced on the previous frame -- its own forward
      model, zero trained parameters; through the real preference path it
      localizes at 3.5 cells vs state_change's 12.1, because the free-run
      reference cancels the network's own settling transients.
    status: refuted
    evidence:
      - "Localization measured offline and through the wired path, 2026-09-23"
      - >
        sg-bioeye-lc-retdec vs sg-bioeye-lc, 75 matched rows, preregistered
        endpoints: score HURTS at every endpoint (full -0.159 [-0.364,-0.003]
        p=0.126; click-19 -0.209; click-dominant-9 -0.444) while LEVELS RISE
        everywhere (21v16, 20v15, 14v9). Measured localization converted to
        breadth, not score: better click targeting opened more first levels on
        more games and lost more points than it gained. The surprise variant was
        killed at 18/75 as a priority decision (its primary contrast was vs
        retdec; no decision hinged on it post-pivot) -- killed, not falsified.
    updated: 2026-09-23

  H-EFFERENCE:
    statement: >
      Delivering the previous action to Johnston's organ (672 antennal
      mechanosensory neurons) makes the connectome action-aware: the circuits
      that read state, above all the mushroom body, know what the agent just
      did, and the forward model's reference carries the same copy so
      self-report cancels exactly in the surprise comparison.
    status: open
    evidence:
      - >
        Measured 2026-09-23: KC action separation 144.7% at scale 0.05 with LC
        perturbed 0.2%; action-only turns produce exactly zero surprise at
        every scale; localization through the real path unchanged (3.4 vs 3.5
        cells). Precision on the prior claim: only the CONNECTOME was
        action-blind -- the controller always knew its actions -- and the old
        scrambled arms carried ~90 weak action connections, near-blind rather
        than blind.
      - >
        Honest expectation, recorded before any arm runs: the score effect of
        sg-bioeye-lc-efference should be near null BY CONSTRUCTION -- the copy
        cancels out of the saliency map and moves the visual readout 0.2%. The
        load-bearing use is sg-mbdr-learn, where the mushroom body can finally
        associate action identity with reinforcement; a null on the bio-eye arm
        does not falsify that.
    updated: 2026-09-23

  H-MB-LEARNING-DENSE:
    statement: >
      The fair null of KC->MBON depression was measured under a 31:1,
      ~8-events-per-episode teaching signal. Routing the controller's per-turn
      outcomes to dopamine -- canonical-novel-and-changed destinations to PAM,
      NOOPs to PPL1, familiar EFFECTs silent, budgeted at 2 terminal-equivalents
      per game with hard per-side caps -- gives the 61k plastic synapses a
      balanced, dense signal inside one episode for the first time. What it can
      learn (which scene-x-action patterns produce change) is within-game
      generalization, the breadth-era currency; measured support: 29/38
      level-clearing clicks re-click a coordinate that previously changed
      something.
    status: "null"
    evidence:
      - >
        Premise checks passed pre-implementation 2026-09-24: dense outcomes are
        action-dependent (novelty p<0.05 on 70/75 rows sha-based, 64/75
        change-gated; binomial null 3.8); saturation arithmetic fixes
        eta_novel=1/513, eta_noop=1/14 of half-budget with per-side caps.
      - "Kill panel verdict: survives all five refutation criteria."
      - >
        RESULT 2026-09-24: null, and a verified one. vs sg-mbdr-nolearn:
        -0.0004, CI [-0.001,+0.000], p=1.000; breadth 6/25 v 7/25; levels 15 v
        16. Crucially the null is not a dead switch: the bundle records
        dense_reinforcement=true and only 5/75 replay hashes match the sparse
        arm -- behaviour changed on 70/75 games and outcomes converged to the
        same clears anyway. Ship gate failed at condition 1; slot not spent;
        controls stay gated. Third and strongest learning null: the signal was
        dense, balanced, and action-dependent, the weights moved, the ties
        broke differently, and none of it changed which levels get cleared.
    updated: 2026-09-24

  H-RECLICK-SEAT:
    statement: >
      The measured clearing regularity -- 29/38 level-clearing clicks re-click a
      coordinate that previously produced change -- can be written INTO the
      decisive seat itself: after each click, the fly's forward-model surprise at
      the clicked coordinate is deposited into a per-game coordinate memory, and
      preference() pays a bonus for returning there. Credit is coordinate-exact
      (zero diffusion), within-game, game-agnostic, and fly-carried (the surprise
      computation is the frozen connectome's own expectation). Attribution bar:
      the fly-surprise writer must beat the grid-diff writer (same memory, raw
      change-mask deposits) or the fly is decorative.
      FROZEN CONSTANTS (preregistered before implementation, 2026-09-24 11:20
      PDT): deposit radius +/-2 cells; memory decay 0.995 per turn; preference
      beta 1.0; per-game deposited-mass cap 50; bonus normalized by running
      median of nonzero memory. Endpoints: primary breadth >10/25 vs
      sg-g2-nolearn on complete matched pairs; score CI not negative; ship
      tonight ONLY if fly arm complete, breadth bar met, score not harmed, and
      fly>griddiff attribution (or griddiff incomplete with the claim tiered).
    status: "null"
    evidence:
      - >
        VERDICT 2026-09-24 13:25 PDT (75 rows each, validation PASS): the
        fly-surprise writer is outcome-INERT -- 75/75 rows byte-identical to
        the champion (breadth 10/25, 21 levels, 0.2034; delta +0.0000, CI
        zero-width). The griddiff control DIVERGED on 5 rows and HURT (19
        levels, breadth 8/25, 0.1937). Attribution result inverted from the
        registered hope: the seat demonstrably CAN change outcomes (the
        trivial writer broke things through it), but the fly's deposits
        never moved a single decision that mattered. Fourth consecutive
        seat-mechanism null. Preregistered Branch A bar (breadth > 10/25
        AND beats griddiff) failed; submission slot stays unspent.
      - "29/38 re-click regularity and 1.79x click advance rate measured 2026-09-24 across three bundles."
    updated: 2026-09-24

  H-FLYHASH-STATE-KEY:
    statement: >
      The fly's olfactory hash (real PN->KC expansion + APL-style
      winner-take-all, the Science-2017 FlyHash) gives ARC observations a
      locality-sensitive state key that fixes the measured state-graph
      fragmentation, with the anatomical wiring load-bearing; downstream,
      MBON habituation over those tags gives a generalizing novelty signal
      (the PNAS-2018 fly Bloom filter).
    status: refuted
    evidence:
      - >
        PREMISE-KILLED OFFLINE 2026-09-25 (results/flyhash_premise.json,
        12 streams, 120-frame samples, near = Hamming<=8, far >= 128).
        Killed twice over: (1) FLY-PARITY on the expansion -- real wiring
        median near/far AUC 0.972 vs degree-preserving rewired 0.984; the
        sparse-expansion motif does all the work, as the LSH literature
        warned. (2) INPUT-SIDE BLINDNESS, the structural kill: through
        the anatomical colour-histogram PN bus, same-palette
        different-layout pairs (Hamming>=32; up to 99 per 120-frame
        sample) receive IDENTICAL tags (Jaccard 1.0) in both real and
        rewired variants -- the olfactory pathway is layout-blind by
        construction, so the fly-hash would catastrophically merge
        genuinely distinct ARC states. The recorded limit is the
        non-retinotopic PN input pathway, not the mushroom-body motif.
        The MBON novelty premise (Rank 2) dies downstream of the same
        input. NOTED, not pursued: a retinotopic-input engineering
        variant (bio-eye features through a seeded random expansion)
        scores AUC 1.0 with over-merge 0.75 -- a workable ENGINEERED
        defragmentation key whose only fly content is the already-shipped
        eye-map; building it is a scope decision under the first
        principle, not a fly finding.
    updated: 2026-09-25
  H-T4T5-CLICK-FEATURES:
    statement: >
      The fly's motion channels (T4/T5, fed by lamina change types) carry
      click-consequence information beyond static patch content, making a
      motion-augmented click head the next fly improvement.
    status: refuted
    evidence:
      - >
        PREMISE-KILLED OFFLINE 2026-09-25 before any build
        (results/premise_killers_t4t5_transfer.json): raw frame-diff
        patches -- which upper-bound every T4/T5-filtered feature, since
        the motion circuit is a function of the same temporal difference
        -- add median +0.000 AUC over static patches (1/10 games improve,
        2 harmed); diff-only features are near-chance in all ten
        click-heavy games. Click consequence is predicted by WHAT IS at a
        location, not what recently moved there. The 13,585 T4/T5
        detectors remain unread because motion is measurably not the
        predictive quantity for this task.
    updated: 2026-09-25
  H-CROSS-GAME-PERSISTENCE:
    statement: >
      Click-consequence knowledge transfers across games, so an Agno-style
      persistent head (weak-RSI layer 2) would compound across the
      evaluation set.
    status: refuted
    evidence:
      - >
        PREMISE-KILLED OFFLINE 2026-09-25 (same record): pooled-24-game
        training tested on the held-out game gives median transfer AUC
        0.523 (chance); ft09, the strongest within-game signal (0.998),
        transfers at 0.165 -- other games' knowledge is anti-predictive
        there. Knowledge is game-specific, consistent with the repo's
        prior 0.000-transfer measurement (Track B). Weak-RSI layer 2 is
        closed for this deployment; layer 1 (within-game online learning)
        remains the shipped mechanism.
    updated: 2026-09-25
  H-MBON-DAN-METAPLASTICITY:
    statement: >
      The fly's one native second-order learning loop -- KC->MBON plasticity
      changing MBON activity, MBON->DAN feedback changing dopaminergic
      drive, dopamine gating future plasticity -- functions in the compiled
      MaleCNS graph strongly enough to matter for behaviour, i.e. the fly
      can leverage recursive self-improvement through its own anatomy.
      (RSI deep dive, user-directed 2026-09-24 evening.)
    status: "null"
    evidence:
      - >
        ANATOMY MEASURED: 2,589 MBON->DAN edges in the modulators graph,
        338/340 DANs receive MBON input, net-inhibitory (weight sum -1.72),
        MBON share of DAN total input 1.9% mean / 9.3% max. The loop is
        present and mechanically CLOSED by construction in the existing
        machinery: MushroomBody.gate() reads DAN activity from the network
        state, and the plastic KC->MBON block lives inside that network.
      - >
        DYNAMICS MEASURED (scripts/mb_second_order.py, twin-trajectory
        design where the weight-frozen twin IS the severed-feedback
        ablation; independent graph loads, shares_memory asserted; 3 games
        x 40 dense-schedule reinforcements): first-order learning is alive
        (absolute weight change 3.4-61.2; MBON activity diverges 2.1%-50%
        from the frozen twin), but the MBON->DAN stage attenuates it
        ~250-500x, leaving a second-order gate component of 4.4e-5 (lp85,
        sparse-change) to 1.8e-3 (cd82, dense-change) relative -- at most
        0.2% of the teaching signal. Trajectories RISE THEN PLATEAU within
        ~40 events in every game: bounded convergence, no compounding.
        VERDICT: the loop is anatomically present, mechanically closed,
        and dynamically inert for RSI purposes -- second-order modulation
        saturates two to four orders below the valence scalar, and the
        growth that "recursive" requires is measurably absent. Coheres
        with the loop compounding a first-order mechanism that itself
        converts to zero score (three prior nulls).
    updated: 2026-09-24
  H-CONSEQUENCE-COUPLING:
    statement: >
      The fly converts to ARC-AGI-3 score only if its output is coupled to
      predicted consequences and seated in the PRIMARY ranking term. Verified
      basis (deep-dive 2026-09-24, wf_11f084c0-be8, 6 agents, all verdicts
      cross-checked): the tie seat is score-inert under every preference
      source (CONFIRMED, 4 independent ways); the metric pays only completed
      levels and squared action-efficiency (CONFIRMED); level 2 has never
      been crossed in 825 rows (CONFIRMED); the literature's connectome
      advantage exists only under a fitting process. Proposed mechanism:
      an ONLINE per-game linear readout of connectome state predicting
      action-consequence (frame change), feeding the primary exploration
      term, StochasticGoose-style (12.58% in the preview with this signal
      from a trained CNN). Fly is load-bearing iff the real connectome's
      features beat BOTH a raw-observation head and the degree-preserving
      null / bypass under identical training.
    status: open
    evidence:
      - >
        PREMISE-KILLER preregistered before any build (AGENTS.md rule 2):
        offline, from the already-captured random-legal streams and states:
        logistic readout per game, features [X_t, one-hot(a_t)], target
        changed(t+1) = any cell differs; temporal split train-first-60%/
        test-last-40% within game; identical protocol for X in {action-only,
        raw-grid-4096, bio-eye y_t, N_t real, N_t null, N_t bypass}; metric
        test AUC per game, median over 25. Trivial alternative NAMED:
        action-one-hot alone (some actions are game-wide no-ops), and
        raw-grid features (no fly). Kill condition: if real N_t's AUC gain
        over action-only is not clearly above the raw-grid gain, the
        reservoir readout premise is dead and the fix must come from the
        encoder/decoder side instead.
      - >
        MEASURED 2026-09-24 ~14:15 PDT (scripts/consequence_premise.py,
        results/jepa/consequence_premise.json; 14 non-degenerate games,
        11 skipped as always-change): median test AUC -- action-only 0.749,
        raw-grid+action 0.738, bio-eye+action 0.738, REAL N_t+action 0.548,
        null 0.560, bypass 0.634. KILL CONDITION MET: the fly's recurrent
        state is WORSE than action identity alone, indistinguishable from
        the rewired null, and beaten by the no-recurrence bypass -- the
        deep dynamics degrade the consequence information the observation
        carries. Reservoir-readout premise DEAD. Surviving fly-load-bearing
        path for the consequence head: bio-eye encoder features (parity
        with raw grid at 0.738); load-bearing test for any built arm is
        bio-eye vs PERMUTED bio-eye under identical training, since
        raw-grid parity alone does not distinguish the retina from pixels.
      - >
        MEASURED 2026-09-24 ~14:30 PDT (click-local extension, results/jepa/
        consequence_click_local.json): a 5x5 patch at the CLICK COORDINATE
        predicts whether the click changes the frame with AUC 0.998 (ft09,
        400 clicks, 5.8% change rate), 0.820 (lp85 -- one of the three games
        carrying 95% of all score, 4.0% change rate), 0.710 (sb26), 0.652
        (sc25); median 0.581 over 10 click-heavy games (small-n high-change
        games have little headroom). The consequence signal is LOCAL, which
        is what every global-feature arm (including N_t) structurally
        misses. Surviving fly-native mechanism: the retinotopic column
        activations AT a candidate click location read by an online head
        feeding the PRIMARY term -- the fly's contribution is retinotopy
        itself, and the load-bearing control is the permuted-retinotopy
        twin (breaks the spatial map, keeps everything else), plus a
        raw-pixel-patch twin and per-coordinate rote memory as the named
        trivial alternatives. Endpoint: levels and per-level action cost
        first (the powered intermediate endpoint), score second.
      - >
        TREATMENT MEASURED 2026-09-24 17:0x PDT (sg-clickhead-retinotopic,
        75 rows): score 0.3064 vs champion 0.2034 (+0.103 paired, ~2.2x
        seed SE -- the largest arm mean recorded) but levels 17 vs 21 and
        breadth 6/25 vs 10/25. BAR A FAILS (levels harmed): NO SUBMISSION,
        slot unspent, per the mechanical rule. Decomposition: the entire
        gain is the premise-predicted games -- r11l L1 cost 1.77x -> 0.68x
        baseline, lp85 1.88x -> 0.94x, the project's first sub-baseline
        completions -- while the head's SUPPRESSION side (negative bonus on
        predicted no-ops) starved discovery in ar25/cd82/lf52/s5i5.
        Robustness: delta without r11l is +0.032, inside seed noise.
        Mechanism readout, stated at tier: MEASURED that boost helped where
        the premise AUC was high and breadth fell where it suppressed;
        INFERRED (bridge: suppression causes the breadth loss) that a
        boost-only bonus keeps the efficiency without the starvation.
      - >
        CALIBRATION PREREGISTERED before running: ONE amendment arm,
        click_head_negative_scale 0.0 (boost-only: the bonus is
        weight*max(2p-1, 0), so the head can promote predicted-changers
        but never demote an untried click below its normal exploration
        rank). Trivial alternative named but NOT run (slot economics):
        halving click_head_weight. Ship bars A/B/C unchanged and still
        binding; the permuted twin re-runs under the same amendment.
      - >
        LADDER MEASURED 2026-09-24 ~17:00 PDT. Symmetric pair:
        sg-clickhead-retinotopic 17 levels / 0.3064 / L1 cost 2.59x vs
        sg-clickhead-permuted 16 levels / 0.1875 / L1 cost 11.59x --
        BAR B PASSES: the fly's retinotopic map is LOAD-BEARING for click
