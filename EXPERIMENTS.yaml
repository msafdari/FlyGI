    protocol_frozen_2026_09_24: >
      Frozen before the first probe run; the tiers are decided by the cells
      named here and nothing else. DATA: 25 public games x 401 frames, ONE
      random-legal stream per game (seed 20260924, derived per-game seeds via
      derived_run_seeds); single-seed limitation registered, contingency =
      one extra seed per game if 5-fold spread cannot order the arms.
      TIMELINE: N_t is the state after advancing on x_t (4 internal steps,
      leak 0.3, gain 2.0, tanh, zeros initial state) and before a_t; pairs
      (t, t+k) that cross a RESET action or a GAME_OVER/WIN frame are
