        stronger verdict requires the next fidelity class.
      - >
        CLASS 2 MEASURED 2026-09-29 (scripts/benchmarks/fc2_*,
        results/benchmarks/fc2_*, same bands, trivial alternatives
        run): KC SPARSE CODING VALIDATES -- held-out median active
        fraction 0.0741 in band with the Lin/APL control passing and
        both trivial alternatives at 1.0000 dense; the MB re-enters
        the verdict pipeline (input gates + ARC association test at
        the validated configuration are now owed). T4/T5 DS fails at
        class-2-frozen (DSI 0.042 vs 0.30; uniform-tau control MATCHES
        heterogeneous-tau: frozen per-pair strengths are the located
        blocker; class 2.5 = trained flyvis ensemble parameters). EB
        ring fails decisively (210 configs, every live one delocalized
        at one ~192-deg fixed point; position-independence now
