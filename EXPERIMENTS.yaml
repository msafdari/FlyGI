      coordinate that previously produced change -- can be written INTO the
      decisive seat itself: after each click, the fly's forward-model surprise at
      the clicked coordinate is deposited into a per-game coordinate memory, and
      preference() pays a bonus for returning there. Credit is coordinate-exact
      (zero diffusion), within-game, game-agnostic, and fly-carried (the surprise
      computation is the frozen connectome's own expectation). Attribution bar:
      the fly-surprise writer must beat the grid-diff writer (same memory, raw
      change-mask deposits) or the fly is decorative.
