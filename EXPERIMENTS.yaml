  H-FB-COLUMNAR-TOPOLOGY:
    statement: >
      The MaleCNS v1.0 fan-shaped-body columnar wiring structurally
      encodes the published vector-computation geometry -- hDelta
      coupling concentrated at ~180-deg FB-column offsets, and
      opposite-signed left/right PFN glomerulus-to-column offsets --
      and degree-preserving rewires destroy both. Structure only
      (Stage-A scope rule); the program's first contact with the
      literature's vector-navigation substrate.
    status: supported
    evidence:
      - >
        PREREGISTERED 2026-10-23 (killtest_design.md section 4).
        Stage-A constants reused unretuned: 200 rewires, seeds
        4242+0..199, p=(1+k)/201, alpha 0.05, coverage floor 0.90.
        Bar 1 hDelta antipode: two-hop labelled-PFN -> hDelta -> FC
        mass fraction within one 40-deg sector of 180 deg beats the
        nulls. Bar 2 PFN mirror: mirror_peak VERBATIM on (FC column
        angle - PB glomerulus angle) profiles, L vs R. PASS iff BOTH
        at p < 0.05. Composition table frozen from the raw release
        annotations, MEASURED IN-CLOUD 2026-10-23 with annotation-only
        contact (weights table deliberately not fetched; decision
        statistics outcome-blind): PFN types 58/40/21/26/64/136/40/
        28/23/20, hDelta 189, vDelta 430, FC 274, PFL 14/12/24.
        In-cloud synthetic gate: an idealized Hulse-motif FB vector
        circuit must PASS both bars and its rewire must KILL them,
        asserted by unit test before data contact. Mapping
        assumptions AC-FB1..6 registered.
      - >
        2026-10 RUN (local, exit 0, 163.4 s; record WORKLOG 3313458):
        PASS -- the program's SECOND structural PASS, on the
        literature's vector-navigation substrate at first contact.
        MEASURED: synthetic gate re-passed on the verdict machine
        (ideal at floor both bars; its rewire kills both); subcircuit
        1,399 nodes / 85,353 signed edges; coverage FC 1.0, hDelta
        1.0, labelled-PFN 0.98788; column counts read EXACTLY the
        registered FC 9 / hDelta 12 / vDelta 10 (AC-FB1 confirmed);
        consensus-NT audit: all columnar types 100% acetylcholine
        (AC-FB5 confirmed on the compiled runtime). Bar 1 hDelta
        antipodal mass 0.40548 vs null max 0.18682 (p 0.00498, the
        floor); Bar 2 PFN mirror 0.01458 vs null max 0.01286
        (p 0.00498, the floor); 200 rewires. Run-JSON values beyond
        the run entry's headline precision (null maxes, NT audit,
        zero _irreg flags, one-hop masses) are banked in the
        2026-10-30 WORKLOG backfill. CONTEXT behaves as the
        Hulse motifs predict: vDelta antipodal mass 0.00041 (~0), PFL
        mirror 0.02168. SCOPE (Stage-A rule, carried): structure
        only -- the MaleCNS FB columnar wiring encodes the published
        vector-computation geometry its degree-preserving rewires
        cannot produce; no computation claim at any fidelity.
    updated: 2026-10-29

  H-T4T5-NATSTAT-DIRECTION:
    statement: >
      The T4/T5 rewire-parity (measured three times) is caused by
      non-ecological input statistics: on translating NATURAL scenes
      at validated class-2.5 physiology, the real wiring beats its
      rewires at direction estimation, and the advantage disappears
      when natural statistics are destroyed by phase-scrambling with
      the power spectrum preserved. First test of SYNTHESIS section 5
      explanation 3.
    status: blocked
    evidence:
      - >
        PREREGISTERED 2026-10-23 (killtest_design.md section 5). 2x2:
        {real, 3 rewires} x {natural, phase-scrambled}; fc25 class-2.5
        machinery and AB-4 encoder verbatim, ONE encoder instance
        across all arms (the AE-1 dodge -- the manipulated variable
        lives in stimulus space); 8 directions x speeds {2.5,5,10}
        col/s; AD-8 vector-vote readout, no fitted parameters; frozen
        van Hateren ID list + checksums (user-fetched; Sintel
        fallback), declared calibration/eval split. Bars: B1 real
        beats rewire mean on natural (paired sign test p < 0.05 AND
        median lower -- Task-2 bar verbatim); B2 the gap is
        statistics-dependent (d_natural > d_scrambled, p < 0.05 AND
        median > 0). PASS iff both. Gates: scramble integrity (rel
        1e-6 amplitude preservation), translation exactness, AD-8
        self-test, G0 (new stimulus path reproduces the measured fc25
        DSI 0.3216 within +/-0.02 and exact subtype tiling on the
        verdict machine), G1 usable-input (real-natural beats the
        90-deg chance floor, else BLOCKED as a convention limit).
        Assumptions ANS-1..5 registered.
      - >
        2026-10 FIRST RUN: BLOCKED at G0 (exit 3; 20.6 s total per the
        run JSON, 5.8 s of measurement per the run entry; records
        WORKLOG 95914f7 + the 2026-10-30 backfill) -- the gate did its job BEFORE any decision
        data: the 2x2 never ran, so nothing here is a verdict.
        MEASURED: scramble selftest passed (worst amplitude rel err
        3.5e-16); corpus checksums first-contact-pinned; G0 pooled
        median DSI 0.17634 vs required 0.3216 +/- 0.02, with the
        T4/ON channel reproducing IN BAND (0.31583, 4 distinct
        preferred) and the T5/OFF channel collapsed (0.11562).
        LOCALIZATION: MEASURED at close time -- the same fc25
        reference reproduced at 0.32157 through the class-3
        instrument's native-edge path the same day, exonerating
        patch, fc25 JSON and machine; the OFF-edge reading of the
        channel split was then the fix LEAD (per-channel values in
        the 2026-10-30 backfill), and it was subsequently MEASURED
        directly by the cloud-side diagnosis (587b40d: composite
        drive at fc2-native +0.5 exactly; OFF scored windows at
        positive lamina drive). Instrument-bug investigation opened cloud-side
        2026-10-29; fix lands with a recorded finding + the frozen
        full re-run rule. Hypothesis remains OPEN, untested.
      - >
        2026-10-29 INSTRUMENT BUG FOUND, MEASURED AND FIXED
        (same day; dated finding in killtest_design.md): the
        drive->external boundary applied INPUT_DRIVE to mid-gray-
        centered contrast instead of absolute luminance -- the
        composite drive sat at exactly fc2-native +0.5 everywhere,
        putting the OFF scored window at POSITIVE lamina drive
        outside fc2's -1..0 envelope (the measured T5/OFF collapse);
        fixed at one shared helper (external = INPUT_DRIVE x (drive
        + MID_GRAY)); post-fix drive divergence 0.0 at plateaus and
        settle, residual = the declared pixel-sampling transient
        (worst-column integral 4.887 -> 0.132 a.u.s); 4 regression
        tests added, each failing on the pre-fix code. FULL LOCAL
        RE-RUN REQUIRED per the frozen rule -- drive equality is
        MEASURED, the DSI consequence is the re-run's to measure.
      - >
        2026-10-31 SECOND RUN: the fix landed as predicted -- pooled
        v2 DSI 0.1763 -> 0.3355 (in band), T4/ON 0.3192, T5/OFF
        0.3434, defined fraction 1.0; corpus bit-stable vs the pinned
        checksums. G0 failed ONLY its tiling-exact clause, entirely on
        T5a: +y vs reference -x at speed-pooled totals 1.3388 vs
        1.3361 (0.2%), the weakest-DSI subtype (0.2044); seven of
        eight exact with comfortable margins. RULED a gate-
        operationalization defect (third recorded argmax-degeneracy
        instance) and AMENDED, dated, in killtest_design.md: tiling is
        tie-aware at G0_TIE_MARGIN 0.98, derived from the measured ~2%
        drive-residual bound, not tuned; tiling_exact still reported;
        a genuine flip still fails; mismatch without totals fails
        conservatively. DSI band, G1, floors, bars unchanged. FULL
        RE-RUN required (third). Pre-stated: G0 passing with G1 still
        failing closes BLOCKED as the registered AB-4 convention
        limit (ANS-5 negative), never a statistics verdict.
      - >
        2026-10-31 THIRD RUN, COMPLETE AND VALID (record: the
        2026-10-31 run-3 WORKLOG entry banking the user's pasted gate
        lines + g1 JSON; 211.3 s; exit 3). G0 PASSED: v2 median DSI
        0.3355 (band 0.3216 +/- 0.02), T4/ON 0.3192, T5/OFF 0.3434,
        tiling tie-aware pass on the same 0.2% T5a tie, exactly as
        amended; corpus checksums verified; scramble selftest
        3.53e-16. G1 FAILED ON THE MEASUREMENT: over 1,152 eval items
        (48 images x 8 directions x 3 speeds, unstable fraction 0.0),
        median absolute heading error 90.91 deg vs the 90.0 deg
        chance floor; exact sign test 572/1152 below chance, p 0.605.
        One plumbing fix en route under the registered allowance
        (449a9e4, crash AT the G1 call before any verdict-relevant
        quantity existed): float 2.0**n overflowed at n=1152; integer
        2**n is exact and bit-identical at every previously run n.
        CLOSE, pre-stated before the run and applied unchanged:
        BLOCKED -- the AB-4-class drive convention did not feed the
        circuit usable input for natural movies (ANS-5 negative).
        MEASURED pair, scope exact: through the same stimulus path
        the circuit decodes moving-edge direction in band and
        natural-movie direction at chance; the convention, not the
        simulation, is where the information dies. Never a statistics
        verdict about natural statistics, T4/T5, or the fly: the 2x2
        (bars B1/B2) never ran. No fourth run.
    updated: 2026-10-31

  H-FLYGI-FLYBENCH-SFA:
    statement: >
      Spike-frequency adaptation (FlyBench's externally measured
      no-free-parameter mechanism: one adaptation state, b 2.0 mV /
      tau_a 200 ms uniform), added default-off to our class-2 engine
      behind the Task-3 FlyBench adapter on the local MaleCNS build,
      improves the hard tier without selling activation or
      specificity.
    status: refuted
    evidence:
      - >
        PREREGISTERED 2026-10-23 (killtest_design.md section 6).
        Comparator = our MEASURED uniform row (core 1.000 / hard
        0.6044 / graded 0.7113 / specificity +0.282; AF-7 unpinned
        build, 176,422 neurons). Bars (ALL): hard-tier graded >=
        uniform + 0.02; overall graded >= 0.701; specificity >=
        +0.252; activation-subset >= uniform - 0.01 (AF-8 guard).
        Unit bridge sfa_b = b_mv/tau_m = 0.1 (derived, not fitted).
        In-cloud gates: off-switch bit-identity; closed-form
        Benda-Herz single-neuron test; toy equivalence vs FlyBench's
        own AdaptiveLIFSimulator. Their measurement (flywire783:
        hard 0.512->0.647) is the external prior; AF-11/AF-12 record
        the transfer bridges as the thing under test.
      - >
        2026-10 RUN (local; record WORKLOG 8f2149a; 19/19 mechanism
        gates green first): KILL. MEASURED (like-for-like vs the
        stored uniform baseline, n_neurons 176,422; all values from
        the verdict-script JSON, banked in the 2026-10-30 WORKLOG
        backfill entry): the verdict script's hard_graded over the
        149 shared checks 0.6078 -> 0.6305 (+0.0226, bar +0.02 MET)
        -- a different denominator by construction from the
        run-headline hard tier (uniform 0.6044; this run 0.6276),
        both real, the bars run on the verdict script's values --
        and activation held (-0.0008, bar MET) and specificity held
        (+0.2684 vs floor +0.252, bar MET) -- but core fell 1.000 ->
        0.8000 and overall graded fell to 0.6940 vs the 0.701 floor
        (bar FAILED).
        CLOSE: SFA at the pinned uniform b 2.0 mV / tau_a 200 ms buys
        hard-tier dynamics by breaking a core task and the overall
        floor on our engine -- the mechanism does not transfer
        beneficially as pinned (AF-11's bridge measured FALSE for
        SFA; AF-12's flywire783->MaleCNS transfer assumption did not
        survive contact). Their measured flywire783 gain is not
        disputed; what the KILL states is that our registered bars on
        our engine refused the trade it carries.
    updated: 2026-10-29

  H-FLYGI-FLYBENCH-TERMINAL:
    statement: >
      Terminal-aware synapse placement (FlyBench's second externally
