  H-STAGEA-NULL-DECOMPOSITION:
    statement: >
      METHODOLOGICAL REFINEMENT, never a reopening: weight-magnitude
      and per-presynaptic-neuron sign shuffles (topology held fixed)
      decompose the program's single structural PASS
      (H-CX-RING-TOPOLOGY) into placement-carried vs
      magnitude/sign-carried components, and close docs/controls.md's
      recorded not-implemented null rows.
    status: supported
    evidence:
      - >
        PREREGISTERED 2026-10-23 (killtest_design.md section 7).
        nulls.py's NullKind literal already declares both kinds
        (never implemented -- the pre-release audit's recorded gap).
        Generators: global and within-presynaptic-column |w| shuffles
        (within-pre PRIMARY, the clean complement of the rewire's
        weight-travels-with-pre rule, AC-N1); Dale-consistent
        per-neuron sign shuffle (AC-N2). Invariants extend
        null_invariants (edge set identical, degrees identical,
        multisets per family). Application: Stage-A statistics on the
        same CX subcircuit, 200 nulls/family, seeds 4242+0..199
        (AC-N3, same seeds for comparability). In-cloud dissociation
        gate both directions: magnitude-tuned synthetic must separate
        under the weight family at the floor; topology-banded
        uniform-weight synthetic must NOT (p >= 0.2) while the rewire
        does; degeneracy floors (>= 0.5 edges change |w|; constant
        sign multiset = NA). Readings are decomposition sentences
        (AC-N4 bridge stated); no closed verdict changes at any
        outcome.
      - >
        2026-10 RUN (local, exit 0, 22.9 s, 600 nulls; record WORKLOG
        3313458): READINGS COMPLETE. MEASURED: the Stage-A signature
        SEPARATES from both weight-shuffle families (within-pre AND
        global: p_banded 0.00498 at the floor, p_mirror 0.00995;
        fraction of magnitudes changed 0.93704/0.96038 per the run
        JSON, banked in the 2026-10-30 backfill -- the >= 0.5
        degeneracy floor cleared)
        and DOES NOT separate from Dale-consistent sign flips
        (p_banded 0.43781, p_mirror 0.82587; sign-family nulls even
        reach bandedness 0.642 > real 0.5881). All invariants valid
        in every family. DECOMPOSITION SENTENCE (the refinement this
        registration bought): H-CX-RING-TOPOLOGY's PASS is carried by
        edge placement AND magnitude assignment jointly, not by the
        sign pattern. NOTE, stated at tier: AC-N4's pre-registered
        bridge anticipated reading "p >= 0.05 under the weight family
        => topology-carried"; the measured outcome is the OTHER
        branch (p < 0.05), so the bandedness/mirror statistics are
        magnitude-dependent as well as placement-dependent -- a
        sharper statement than Stage A alone licensed. No closed
        verdict changes (refinement, as registered).
    updated: 2026-10-29

