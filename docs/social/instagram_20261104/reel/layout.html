<!doctype html><html lang="en"><meta charset="utf-8"><title>FlyGI six-click Reel</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#032c2c;color:#f8f4e7;font-family:Arial,Helvetica,sans-serif}#stage{width:1080px;height:1920px;overflow:hidden;position:relative;background:radial-gradient(ellipse at 70% 60%,#14574d,#032c2c 66%,#031d20)}
#art{position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover;opacity:.8}#shade{position:absolute;inset:0;background:linear-gradient(#002424d9,transparent 52%,#002424ed 89%)}
.brand{position:absolute;left:70px;top:150px;color:#97f3d3;font-size:29px;font-weight:800;letter-spacing:5px}.by{position:absolute;right:160px;top:155px;color:#b7ceca;font-size:22px;letter-spacing:2px}
#headline{position:absolute;left:70px;right:155px;top:252px;margin:0;font-size:83px;line-height:1.07;font-weight:800;letter-spacing:-3px}em{font-style:normal;color:#97f3d3}
#gamewrap{display:none;position:absolute;left:67px;top:480px;width:858px;height:858px;border:1px solid #97f3d35e;border-radius:18px;background:#032022;padding:12px;box-shadow:0 24px 80px #0006}
#game{width:832px;height:832px;image-rendering:pixelated;display:block}#ring{display:none;position:absolute;width:52px;height:52px;border:5px solid #fff;border-radius:50%;box-shadow:0 0 0 5px #ff851bb8,0 0 25px #ff851b;transform:translate(-50%,-50%)}
#counter{position:absolute;right:0;top:-75px;border:1px solid #97f3d3;background:#032c2cf5;border-radius:40px;padding:13px 25px;font-size:28px;font-weight:bold;color:#97f3d3}
#subline{position:absolute;left:70px;right:155px;top:1385px;font-size:29px;line-height:1.35;color:#b7ceca;margin:0}
#caption{position:absolute;left:70px;right:155px;top:1470px;font-size:43px;font-weight:700;line-height:1.22;text-align:center;padding:20px 24px;background:#002424ec;border-radius:18px;min-height:97px}
#footer{position:absolute;left:70px;right:155px;top:1650px;font-size:22px;color:#b7ceca;line-height:1.4}
#comparison{display:none;position:absolute;left:70px;right:155px;top:570px;gap:24px;grid-template-columns:1fr 1fr}.card{padding:26px 22px;background:#124b438c;border:1px solid #97f3d34f;border-radius:25px}.label{font-size:30px;line-height:1.25;min-height:82px}.value{font-size:163px;letter-spacing:-6px;font-weight:800;color:#97f3d3;line-height:1.08}.unit{font-size:29px;color:#b7ceca;line-height:1.3}.alt{background:#4e3b2b77;border-color:#ffc68555}.alt .value{color:#ffc685}
#broader{display:none;position:absolute;left:70px;right:155px;top:610px}.row{display:flex;justify-content:space-between;align-items:center;font-size:32px;margin-bottom:20px}.row b{font-size:70px;color:#97f3d3}.row.altrow b{color:#ffc685}.dots{display:grid;grid-template-columns:repeat(15,1fr);gap:10px;margin-bottom:48px}.dot{height:23px;background:#ffffff10;border-radius:5px}.dot.lit{background:#97f3d3}.amber .dot.lit{background:#ffc685}
#cta{display:none;position:absolute;left:70px;right:155px;top:1310px;font-size:35px;line-height:1.4}.link{color:#97f3d3;font-size:32px;font-weight:bold;margin-top:15px}
.eyescene #art{height:900px;top:440px;object-fit:cover;opacity:1}.eyescene #shade{background:linear-gradient(#002424 19%,transparent 45%,#002424 80%)}
.gamescene #headline{font-size:72px;top:250px}.gamescene #caption{top:1500px}.gamescene #subline{top:1370px}
.statsscene #headline{top:280px;font-size:80px}.statsscene #subline{top:1160px;font-size:32px}.statsscene #caption{top:1450px}
</style>
<section id="stage"><img id="art"><div id="shade"></div><div class="brand">FLYGI</div><div class="by">MUSTAFA SAFDARI</div><h1 id="headline"></h1><div id="gamewrap"><img id="game"><div id="ring"></div><div id="counter"></div></div><div id="comparison"><div class="card"><div class="label">Fly’s<br>visual map</div><div class="value">6</div><div class="unit">actions to clear<br>level one</div></div><div class="card alt"><div class="label">Same map,<br>rearranged</div><div class="value">199</div><div class="unit">actions to clear<br>level one</div></div></div><div id="broader"><div class="row"><span>Fly’s visual map</span><b>17 / 75</b></div><div class="dots" id="real-dots"></div><div class="row altrow"><span>Rearranged map</span><b>16 / 75</b></div><div class="dots amber" id="null-dots"></div></div><p id="subline"></p><div id="cta">Follow the experiments.<div class="link">github.com/msafdari/FlyGI</div></div><div id="caption"></div><div id="footer"></div></section>
<script>
for(const [id,n] of [['real-dots',17],['null-dots',16]])for(let i=0;i<75;i++){const el=document.createElement('div');el.className='dot'+(i<n?' lit':'');document.getElementById(id).append(el)}
window.setState = async s => {
 const el=id=>document.getElementById(id);el('stage').className=s.style||'';
 el('art').src=s.art;el('art').style.display=s.art?'block':'none';el('shade').style.display=s.art?'block':'none';
 el('headline').innerHTML=s.headline;el('caption').textContent=s.caption||'';el('caption').style.display=s.caption?'block':'none';el('subline').innerHTML=s.subline||'';el('footer').textContent=s.footer||'';
 el('gamewrap').style.display=s.game?'block':'none';if(s.game)el('game').src=s.game;el('counter').textContent=s.counter||'';el('counter').style.display=s.counter?'block':'none';
 el('ring').style.display=s.click?'block':'none';if(s.click){el('ring').style.left=(12+(s.click[0]+.5)*13)+'px';el('ring').style.top=(12+(s.click[1]+.5)*13)+'px'}
 el('comparison').style.display=s.compare?'grid':'none';el('broader').style.display=s.broader?'block':'none';el('cta').style.display=s.cta?'block':'none';
 await Promise.all(Array.from(document.images).filter(im=>im.style.display!=='none'&&im.getAttribute('src')).map(im=>im.decode()));
};
</script></html>
