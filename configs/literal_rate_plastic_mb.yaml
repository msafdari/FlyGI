# Retains monoaminergic neurons instead of deleting them.
#
# modulator_treatment: zero removes every outgoing edge of the 541 modulatory
# neurons, which in the signed runtime deleted 129,132 dopaminergic edges into
# Kenyon cells and 3,195 into MBONs -- the entire teaching pathway of the fly's
# learning circuit. Measured consequence: a rewarded plasticity update on that
# runtime changes exactly zero weight.
#
# `positive` is an acknowledged approximation. Dopamine's real role here is to
# gate plasticity, not to drive rate; the learning rule uses dopaminergic
# ACTIVITY and the real DAN->MBON adjacency, not this sign. The sign only
# determines how modulatory neurons contribute to ordinary propagation, and
# retaining the edges is what makes the circuit exist at all.
# Frozen score-improvement candidate. This config is identical to
# configs/literal_rate_signed.yaml except for the experiment name and the five
# explicit loop-escape fields under decoder. The 0.25/0.50 strengths were
# selected by the score-blind calibration recorded on 2026-09-22.
schema_version: 1
seed: 20260919

experiment:
  name: literal-rate-plastic-mb-loop-escape
  track: literal

data:
  release: male-cns:v1.0
  weights_path: data/raw/connectome-weights-male-cns-v1.0-minconf-0.5.feather
  annotations_path: data/raw/body-annotations-male-cns-v1.0-minconf-0.5.feather
  neurotransmitters_path: data/raw/body-neurotransmitters-male-cns-v1.0.feather
  output_dir: data/processed/male-cns-v1.0/literal-rate-signed-modulators
  sources:
    weights:
      url: https://storage.googleapis.com/flyem-male-cns/v1.0/connectome-data/flat-connectome/connectome-weights-male-cns-v1.0-minconf-0.5.feather
      sha256: null
    annotations:
      url: https://storage.googleapis.com/flyem-male-cns/v1.0/connectome-data/flat-connectome/body-annotations-male-cns-v1.0-minconf-0.5.feather
      sha256: null
    neurotransmitters:
      url: https://storage.googleapis.com/flyem-male-cns/v1.0/connectome-data/flat-connectome/body-neurotransmitters-male-cns-v1.0.feather
      sha256: null

graph:
  matrix_convention: "W[post_index, pre_index]"
  output_dir: data/processed/male-cns-v1.0/literal-rate-signed-modulators
  weight_transform: log1p
  sign_mode: heuristic
  modulator_treatment: positive
  unknown_transmitter_treatment: zero
  normalization: incoming_l1
  spectral_radius: null
  epsilon: 1.0e-8
  allow_self_edges: false
  node_filter_column: superclass
  node_filter_values: null
  body_id_dtype: uint64
  weight_dtype: float32

groups:
  descending_neurons:
    superclass: descending_neuron

dynamics:
  backend: rate
  execution_backend: scipy-csr-cpu
  activation: tanh
  internal_steps: 4
  leak: 0.3
  recurrent_gain: 0.9
  bias: 0.0
  # Plasticity modifies Kenyon-cell-to-MBON weights, so this config must not
  # claim a frozen graph. Config validation enforces the pairing.
  frozen_graph: false
  initial_state: zeros
  state_dtype: float32

encoder:
  kind: sparse_projection
  sensory_superclass: ol_sensory
  connections_per_neuron: 64
  input_scale: 1.0
  trainable: false
  per_game_rules: false

decoder:
  kind: literal
  readout: descending_neurons
  action_slots: 8
  coordinate_head: literal_factorized_bins
  sampling_method: zscore_softmax_categorical
  action_temperature: 0.15
  coordinate_temperature: 0.2
  decision_seed_policy: explicit_per_policy_or_config_derived
  coordinate_fallback: novelty_centroid
  unchanged_click_exploration: seeded_untried_uniform
  readout_normalization: adaptive
  adaptation_rate: 0.1
  clip: 10.0
  loop_escape_enabled: true
  loop_escape_exploration_bonus: 0.25
  loop_escape_unchanged_failure_penalty: 0.50
  loop_escape_state_hash: blake2b_128
  loop_escape_coordinate_memory: per_observation
  trainable: false

state:
  reset_on_new_environment: true
  preserve_across_levels: true
  preserve_across_actions: true
  preserve_after_game_over_reset: true

plasticity:
  # Reward-modulated plasticity at the site where Drosophila actually learns.
  # Roughly 61,210 Kenyon-cell-to-MBON synapses become plastic; every other
  # weight in the 24.5-million-edge graph stays frozen, and the topology is
  # frozen unconditionally.
  enabled: true
  site: kenyon_cell_to_mbon
  learning_rate: 0.05
  decay: 0.01
  weight_ceiling_scale: 2.0
  reward_scale: 1.0
  # observation_change is dense and is the measured deficit: the agent repeats
  # states far more than chance, so "did my action change anything" is the
  # signal it most lacks. level_progress is sparse but unambiguous. Neither
  # reads hidden scoring state.
  reward_source: both
  level_reward: 1.0
  reset_on_new_environment: true
