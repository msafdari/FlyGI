# Track B declaration for later milestones. Data, graph, and rate dynamics are
# typed today; no reservoir interface training is implemented by this config.
schema_version: 1
seed: 20260919

experiment:
  name: frozen-reservoir-rate
  track: frozen_reservoir

data:
  release: male-cns:v1.0
  weights_path: data/raw/connectome-weights-male-cns-v1.0-minconf-0.5.feather
  annotations_path: data/raw/body-annotations-male-cns-v1.0-minconf-0.5.feather
  neurotransmitters_path: data/raw/body-neurotransmitters-male-cns-v1.0.feather
  output_dir: data/processed/male-cns-v1.0/reservoir-rate
  sources:
    weights:
      url: https://storage.googleapis.com/flyem-male-cns/v1.0/connectome-data/flat-connectome/connectome-weights-male-cns-v1.0-minconf-0.5.feather
      sha256: null
    annotations:
      url: https://storage.googleapis.com/flyem-male-cns/v1.0/connectome-data/flat-connectome/body-annotations-male-cns-v1.0-minconf-0.5.feather
      sha256: null
    neurotransmitters:
      url: https://storage.googleapis.com/flyem-male-cns/v1.0/connectome-data/flat-connectome/body-neurotransmitters-male-cns-v1.0.feather
      sha256: null

graph:
  matrix_convention: "W[post_index, pre_index]"
  output_dir: data/processed/male-cns-v1.0/reservoir-rate
  weight_transform: log1p
  sign_mode: heuristic
  modulator_treatment: zero
  normalization: spectral_radius
  spectral_radius: 0.9
  epsilon: 1.0e-8
  allow_self_edges: false
  node_filter_column: superclass
  node_filter_values: null
  body_id_dtype: uint64
  weight_dtype: float32

groups:
  descending_neurons:
    superclass: descending_neuron

dynamics:
  backend: rate
  execution_backend: scipy-csr-cpu
  activation: tanh
  # Measured 2026-09-21: sensory drive needs three anatomical hops and four
  # internal steps before all 1,314 descending neurons carry any activity. At
  # K=2 the readout is blind on an episode's first decision. K=4 is the
  # anatomical minimum, and costs about 140 ms per action on the development
  # machine. Kaggle-runtime timing must be rechecked before deployment.
  internal_steps: 4
  leak: 0.3
  recurrent_gain: 0.9
  bias: 0.0
  frozen_graph: true
  initial_state: zeros
  state_dtype: float32

encoder:
  # Track B will train only a small interface; until then this declares the same
  # nonlearned projection the literal condition uses.
  kind: sparse_projection
  sensory_superclass: ol_sensory
  connections_per_neuron: 64
  input_scale: 1.0
  trainable: false
  per_game_rules: false

decoder:
  kind: literal
  readout: descending_neurons
  action_slots: 8
  coordinate_head: literal_factorized_bins
  # Population z-scoring alone leaves the decision dominated by each neuron's
  # fixed offset and by the slow global drift of the state. The adaptive
  # readout reports deviation from a per-neuron EMA expectation instead.
  readout_normalization: adaptive
  adaptation_rate: 0.1
  clip: 10.0
  trainable: false

state:
  reset_on_new_environment: true
  preserve_across_levels: true
  preserve_across_actions: true
  preserve_after_game_over_reset: true

training:
  enabled: false
  note: Track B training is not implemented or run yet.
