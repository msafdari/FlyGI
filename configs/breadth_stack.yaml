# P3: the breadth stack. Experiment 002, post-refactor, breadth-primary era.
#
# Combines the two best level-producers in the closed ledger, both fly-carried:
#   - bio-eye encoder + T4/T5 motion readout: 22 levels / 8 games (the
#     league's only HELPS, +0.0717 CI [+0.005,+0.156], audit-clean)
#   - retinotopic_state click coordinates: 21 levels / 8 games on the LC arm
#     (score HURTS locally, but the hidden set pays P(first level | unseen
#     game), not local mean score -- WORKLOG, breadth reframe)
# Tie-break fly included as always. Learning off. Surprise variant not used:
# its behavioural arm was killed 18/75 and it costs 2x network advances.
#
# PREREGISTERED PRIMARY ENDPOINT: games with >=1 level (breadth), against
# sg-bioeye-t4t5. Best breadth ever recorded is 10/25; this ships to Kaggle
# only if it beats that. EXPECTED tier: component breadth gains may not
# compose -- that is exactly what this arm measures, and the base rate for
# stacked improvements in this project is poor.
schema_version: 1
seed: 20260919

experiment:
  name: breadth-stack
  track: literal

data:
  release: male-cns:v1.0
  weights_path: data/raw/connectome-weights-male-cns-v1.0-minconf-0.5.feather
  annotations_path: data/raw/body-annotations-male-cns-v1.0-minconf-0.5.feather
  neurotransmitters_path: data/raw/body-neurotransmitters-male-cns-v1.0.feather
  output_dir: data/processed/male-cns-v1.0/literal-rate-signed-modulators
  sources:
    weights:
      url: https://storage.googleapis.com/flyem-male-cns/v1.0/connectome-data/flat-connectome/connectome-weights-male-cns-v1.0-minconf-0.5.feather
      sha256: null
    annotations:
      url: https://storage.googleapis.com/flyem-male-cns/v1.0/connectome-data/flat-connectome/body-annotations-male-cns-v1.0-minconf-0.5.feather
      sha256: null
    neurotransmitters:
      url: https://storage.googleapis.com/flyem-male-cns/v1.0/connectome-data/flat-connectome/body-neurotransmitters-male-cns-v1.0.feather
      sha256: null

graph:
  matrix_convention: "W[post_index, pre_index]"
  output_dir: data/processed/male-cns-v1.0/literal-rate-signed-modulators
  weight_transform: log1p
  sign_mode: heuristic
  modulator_treatment: positive
  unknown_transmitter_treatment: zero
  normalization: incoming_l1
  spectral_radius: null
  epsilon: 1.0e-8
  allow_self_edges: false
  node_filter_column: superclass
  node_filter_values: null
  body_id_dtype: uint64
  weight_dtype: float32

groups:
  descending_neurons:
    superclass: descending_neuron
  lc_object_detectors:
    type_prefix: LC
  motion_detectors:
    type_prefix:
      - T4
      - T5

dynamics:
  backend: rate
  execution_backend: scipy-csr-cpu
  activation: tanh
  internal_steps: 4
  leak: 0.3
  recurrent_gain: 2.0
  bias: 0.0
  frozen_graph: true
  initial_state: zeros
  state_dtype: float32

encoder:
  kind: retinotopic_colour
  sensory_superclass: ol_sensory
  connections_per_neuron: 64
  input_scale: 1.0
  trainable: false
  per_game_rules: false

decoder:
  kind: literal
  coordinate_source: retinotopic_state
  readout: motion_detectors
  action_slots: 8
  coordinate_head: literal_factorized_bins
  sampling_method: zscore_softmax_categorical
  action_temperature: 0.15
  coordinate_temperature: 0.2
  decision_seed_policy: explicit_per_policy_or_config_derived
  coordinate_fallback: factorized
  unchanged_click_exploration: seeded_untried_uniform
  readout_normalization: adaptive
  adaptation_rate: 0.1
  clip: 10.0
  loop_escape_enabled: true
  loop_escape_exploration_bonus: 0.25
  loop_escape_unchanged_failure_penalty: 0.50
  loop_escape_state_hash: blake2b_128
  loop_escape_coordinate_memory: per_observation
  trainable: false

state:
  reset_on_new_environment: true
  preserve_across_levels: true
  preserve_across_actions: true
  preserve_after_game_over_reset: true
