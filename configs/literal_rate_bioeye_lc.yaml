# Give the fly's eye a real image: retinotopic AND colour-preserving.
#
# The two existing encoders are each broken, in opposite ways. sparse_projection
# keeps the sixteen ARC colours as a one-hot and destroys retinotopy, giving each
# photoreceptor 64 uniformly random features so neighbouring receptors see
# unrelated parts of the screen. retinotopic keeps space and destroys colour,
# mapping the colours onto a scalar ramp (grid / 15) and then AVERAGING that ramp
# within each column -- the mean of colour 3 and colour 9 is colour 6, a third
# unrelated category. That encoder scored 0.003156 against the random
# projection's 0.190476, and this is why.
#
# T4/T5 compute motion by comparing adjacent columns, and LC neurons integrate
# over retinotopic neighbourhoods. Both are pure spatial computations, so a
# scrambled input removes the one property they exist to exploit. Per the
# project's first principle, plumbing exists to hand a fly circuit input it
# evolved to read; this is that plumbing done correctly.
#
# Measured, not assumed:
#   - photoreceptors carry NO column assignment (0 of 6,098), so injection is at
#     the lamina/medulla interneurons: 23,720 neurons over 892 columns;
#   - a column carries 15 distinct types, not 16, and 814 of 892 (91.3%) carry
#     all fifteen;
#   - ARC colour 0 is NOT background (2.72% over 1,200 real frames; colour 9
#     dominates at 36.89%), so there is no free colour to drop.
#
# Sixteen colours into fifteen channels forces one collision. It falls on
# colours 0 and 15 by the fixed rule c % 15, deliberately NOT chosen from the
# measured frequencies: tuning the encoder to the games it is scored on would put
# engineering in the plumbing.
#
# There is no changed-cell channel. The previous encoder spent T1, C2 and C3 on a
# mask computed in Python; those channels go back to colour and motion is left to
# the 13,585 T4/T5 neurons evolved to compute it.
#
# Readout is LC, the fly's object detectors. Matched control is the arm running
# the identical readout on the scrambled sparse projection.
schema_version: 1
seed: 20260919

experiment:
  name: literal-rate-bioeye-lc
  track: literal

data:
  release: male-cns:v1.0
  weights_path: data/raw/connectome-weights-male-cns-v1.0-minconf-0.5.feather
  annotations_path: data/raw/body-annotations-male-cns-v1.0-minconf-0.5.feather
  neurotransmitters_path: data/raw/body-neurotransmitters-male-cns-v1.0.feather
  output_dir: data/processed/male-cns-v1.0/literal-rate-signed-modulators
  sources:
    weights:
      url: https://storage.googleapis.com/flyem-male-cns/v1.0/connectome-data/flat-connectome/connectome-weights-male-cns-v1.0-minconf-0.5.feather
      sha256: null
    annotations:
      url: https://storage.googleapis.com/flyem-male-cns/v1.0/connectome-data/flat-connectome/body-annotations-male-cns-v1.0-minconf-0.5.feather
      sha256: null
    neurotransmitters:
      url: https://storage.googleapis.com/flyem-male-cns/v1.0/connectome-data/flat-connectome/body-neurotransmitters-male-cns-v1.0.feather
      sha256: null

graph:
  matrix_convention: "W[post_index, pre_index]"
  output_dir: data/processed/male-cns-v1.0/literal-rate-signed-modulators
  weight_transform: log1p
  sign_mode: heuristic
  modulator_treatment: positive
  unknown_transmitter_treatment: zero
  normalization: incoming_l1
  spectral_radius: null
  epsilon: 1.0e-8
  allow_self_edges: false
  node_filter_column: superclass
  node_filter_values: null
  body_id_dtype: uint64
  weight_dtype: float32

groups:
  descending_neurons:
    superclass: descending_neuron
  lc_object_detectors:
    type_prefix: LC

dynamics:
  backend: rate
  execution_backend: scipy-csr-cpu
  activation: tanh
  internal_steps: 4
  leak: 0.3
  recurrent_gain: 2.0
  bias: 0.0
  frozen_graph: true
  initial_state: zeros
  state_dtype: float32

encoder:
  kind: retinotopic_colour
  sensory_superclass: ol_sensory
  connections_per_neuron: 64
  input_scale: 1.0
  trainable: false
  per_game_rules: false

decoder:
  kind: literal
  readout: lc_object_detectors
  action_slots: 8
  coordinate_head: literal_factorized_bins
  sampling_method: zscore_softmax_categorical
  action_temperature: 0.15
  coordinate_temperature: 0.2
  decision_seed_policy: explicit_per_policy_or_config_derived
  coordinate_fallback: factorized
  unchanged_click_exploration: seeded_untried_uniform
  readout_normalization: adaptive
  adaptation_rate: 0.1
  clip: 10.0
  loop_escape_enabled: true
  loop_escape_exploration_bonus: 0.25
  loop_escape_unchanged_failure_penalty: 0.50
  loop_escape_state_hash: blake2b_128
  loop_escape_coordinate_memory: per_observation
  trainable: false

state:
  reset_on_new_environment: true
  preserve_across_levels: true
  preserve_across_actions: true
  preserve_after_game_over_reset: true
